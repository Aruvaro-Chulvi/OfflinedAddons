<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
  /* Offlined's colours: your panel does not inherit them, so it defines its own. */
  :root {
    --bg: #f6f6f6; --panel: #ffffff; --ink: #1f1f1f; --muted: #d6d6d6;
    --soft: #e9e9e9; --subtle: #666666; --accent: #2d2d2d; --accent-line: #2d2d2d;
  }
  [data-theme="dark"] {
    --bg: #0f0f10; --panel: #17181a; --ink: #e9e9ea; --muted: #2b2c31;
    --soft: #222327; --subtle: #9a9a9a; --accent: #dedede; --accent-line: #6b6d75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    background: var(--panel); border: 1px solid var(--muted); border-radius: 14px;
    padding: 32px 40px; text-align: center; min-width: 280px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { color: var(--subtle); margin: 0 0 24px; }
  .count { font-size: 3rem; font-weight: 700; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; justify-content: center; }
  /* Flat buttons, like Offlined: the active state is a colour change, never a shadow. */
  button {
    font: inherit; padding: 8px 18px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--muted); background: var(--soft); color: var(--ink);
  }
  button:hover { border-color: var(--subtle); }
  /* The main button is grey too, with a stronger border: Offlined keeps colour for content, not for buttons. */
  button.primary { border-color: var(--accent-line); font-weight: 600; }
</style>
</head>
<body>
  <main class="card">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="count" id="count">0</div>
    <div class="row">
      <button class="primary" id="add"></button>
      <button id="reset"></button>
    </div>
  </main>

<script>
(function () {
  "use strict";
  const ID = "hello-world";   // the same as "id" in addon.json
  const params = new URLSearchParams(location.search);

  // ── Theme: the one Offlined had when it opened us, then follow its changes ──
  const theme = params.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = theme;
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;   // only messages from Offlined itself
    if (e.data && e.data.type === "theme") document.documentElement.dataset.theme = e.data.value;
  });

  // ── Language: one of Offlined's ten, English when we don't have it ──
  const T = {
    en: { title: "Hello from my addon", subtitle: "This counter is saved in the addon's own storage.", add: "Add one", reset: "Reset" },
    es: { title: "Hola desde mi addon", subtitle: "Este contador se guarda en el almacén propio del addon.", add: "Sumar uno", reset: "Poner a cero" },
  };
  const lang = params.get("lang") || "en";
  const t = (k) => (T[lang] && T[lang][k]) || T.en[k];
  document.documentElement.lang = lang;
  if (lang === "ar") document.documentElement.dir = "rtl";
  for (const id of ["title", "subtitle", "add", "reset"]) document.getElementById(id).textContent = t(id);

  // ── Storage: one JSON object per addon, kept across updates ──
  // Offlined 4 closes this page when the user goes to another section: save every change right away, as below.
  const countEl = document.getElementById("count");
  let count = 0;
  const show = () => { countEl.textContent = count.toLocaleString(lang); };
  const save = () => fetch(`/api/addons/${ID}/storage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data: { version: 1, count } }),
  }).catch(() => {});

  fetch(`/api/addons/${ID}/storage`)
    .then((r) => r.json())
    .then(({ data }) => { count = Number(data.count) || 0; show(); })
    .catch(show);

  document.getElementById("add").addEventListener("click", () => { count++; show(); save(); });
  document.getElementById("reset").addEventListener("click", () => { count = 0; show(); save(); });
})();
</script>
</body>
</html>
