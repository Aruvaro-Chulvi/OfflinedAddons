<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="stylesheet" href="/vendor/quill/quill.snow.css">
<script src="/vendor/quill/quill.min.js"></script>
<script src="sidebar.js"></script>
<style>
:root {
  --bg: #f6f6f6;
  --panel: #ffffff;
  --ink: #1f1f1f;
  --muted: #d6d6d6;
  --soft: #e9e9e9;
  --subtle: #6b7280;
  --accent: #2d2d2d;
}
[data-theme="dark"] {
  --bg: #0f0f10;
  --panel: #17181a;
  --ink: #e9e9ea;
  --muted: #2b2c31;
  --soft: #222327;
  --subtle: #9a9a9a;
  --accent: #dedede;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; overflow: hidden;
}
.hidden { display: none !important; }
button, input, select { font-family: inherit; }

.nt-view { display: flex; width: 100%; height: 100%; background: var(--panel); }

/* ── Editor ── */
.nt-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); overflow: hidden; }
.nt-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--muted); flex-shrink: 0; }
.nt-title-input {
  flex: 1; min-width: 0; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--ink); font-size: .9rem; outline: none; transition: border-color .15s;
}
.nt-title-input:focus { border-color: var(--accent); }
.nt-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--soft);
  color: var(--ink); font-size: .82rem; cursor: pointer; display: inline-flex; align-items: center;
  gap: 6px; white-space: nowrap; transition: background .15s, border-color .15s;
}
.nt-btn .ofs-ic { width: 16px; height: 16px; }
.nt-btn:hover { background: var(--muted); }
.nt-btn--icon { padding: 6px 8px; }
.nt-btn--primary { font-weight: 600; }

/* ── Quill ── */
.nt-quill-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ql-toolbar.ql-snow {
  border: none !important; border-bottom: 1px solid var(--muted) !important;
  background: var(--panel); flex-shrink: 0;
}
.ql-container.ql-snow { border: none !important; flex: 1; overflow-y: auto; font-size: .95rem; }
.ql-editor { min-height: 100%; color: var(--ink); }
.ql-snow .ql-stroke { stroke: var(--ink); }
.ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill { fill: var(--ink); }
.ql-snow .ql-picker { color: var(--ink); }
.ql-snow .ql-picker-options { background: var(--panel); border-color: var(--muted) !important; }
.ql-editor.ql-blank::before { color: var(--subtle); }

#ntToast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  background: var(--accent); color: var(--bg); padding: 8px 16px; border-radius: 10px;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 500;
}
#ntToast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="nt-view">
  <div class="nt-editor">
    <div class="nt-header">
      <input id="noteTitle" class="nt-title-input" type="text" placeholder="Untitled note" autocomplete="off">
      <button id="noteGeoBtn" class="nt-btn nt-btn--icon"><svg data-ic="map-pin"></svg></button>
      <button id="noteSaveBtn" class="nt-btn nt-btn--primary"><svg data-ic="save"></svg><span id="noteSaveLbl">Save</span></button>
    </div>
    <div class="nt-quill-wrap">
      <div id="quillToolbar">
        <span class="ql-formats">
          <select class="ql-header"></select>
          <button class="ql-bold"></button>
          <button class="ql-italic"></button>
          <button class="ql-underline"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="ordered"></button>
          <button class="ql-list" value="bullet"></button>
          <button class="ql-link"></button>
        </span>
      </div>
      <div id="quillEditor"></div>
    </div>
  </div>
</div>

<div id="ntToast"></div>

(function () {
  const p = new URLSearchParams(location.search);
  const th = p.get("theme");
  if (th === "dark" || (!th && window.matchMedia?.("(prefers-color-scheme: dark)").matches))
    document.documentElement.setAttribute("data-theme", "dark");
})();
window.addEventListener("message", e => { if (e.data?.type === "theme") document.documentElement.setAttribute("data-theme", e.data.value); });

const _LANG = (() => {
  const l = (new URLSearchParams(location.search).get("lang") || "en").slice(0, 2).toLowerCase();
  return I18N[l] ? l : "en";
})();
document.documentElement.setAttribute("lang", _LANG);
if (_LANG === "ar") document.documentElement.setAttribute("dir", "rtl");
function t(key) { return I18N[_LANG]?.[key] || I18N.en[key] || key; }
function escapeHTML(s = "") { return String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch])); }

let _toastT = null;
function toast(msg) {
  const el = document.getElementById("ntToast");
  el.textContent = String(msg);
  el.classList.add("show");
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove("show"), 2400);
}

(function () {
  const API = "/api/addon-notes";
  const noteSaveBtn    = document.getElementById("noteSaveBtn");
  const noteGeoBtn     = document.getElementById("noteGeoBtn");
  const noteTitleInput = document.getElementById("noteTitle");

  let activeId = null;
  let quill = null;
  let _dirty = false;

  async function _api(path, opts) {
    const r = await fetch(`${API}${path}`, opts);
    if (!r.ok) throw new Error(await r.text());
    const ct = r.headers.get("content-type") || "";
    return ct.includes("application/json") ? r.json() : null;
  }
  const postNote = body => _api("/note", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

  function _deltaToPlainText(delta) {
    return (delta?.ops || []).map(op => typeof op.insert === "string" ? op.insert : "").join("");
  }
  function _snippet(delta) {
    const s = _deltaToPlainText(delta).replace(/\s+/g, " ").trim();
    return s.length > 140 ? s.slice(0, 140) + "…" : s;
  }
  // Hora de un documento: updated_at del backend; los antiguos solo tienen el id (= Date.now() al crear).
  function noteTime(n) {
    if (n.updated) return Number(n.updated) * 1000;
    if (/^\d{12,}$/.test(String(n.id))) return Number(n.id);
    return 0;
  }
  const toItem = n => ({ id: String(n.id), title: n.title || t("untitled"), time: noteTime(n), snippet: n.snippet || "" });
  const currentTitle = id => (id === activeId ? (noteTitleInput.value || "").trim() : sb.getItem(id)?.title) || t("untitled");

  async function getDelta(id) {
    if (id === activeId && quill) return quill.getContents();
    const full = await _api(`/note?id=${encodeURIComponent(id)}`);
    return (full && full.delta) || { ops: [] };
  }

  function setDirty(v) { _dirty = !!v; sb.setDirty(_dirty); }
  function confirmDiscard() {
    if (!_dirty || !activeId) return Promise.resolve(true);
    return sb.dialog({ title: t("unsavedTitle"), message: t("unsavedMsg") });
  }

  // ── Barra lateral común ─────────────────────────────────────
  const sb = OflSidebar.create({
    host: document.querySelector(".nt-view"),
    before: document.querySelector(".nt-editor"),
    addonId: "notes", lang: _LANG, toast,
    strings: { heading: t("heading"), newItem: t("newItem"), searchPh: t("searchPh"), empty: t("empty"),
               untitled: t("untitled"), deleteTitle: t("deleteTitle"), deleteMsg: t("deleteMsg"), duplicate: t("duplicate") },
    onOpen: id => openNote(id),
    onNew: fid => noteNew(fid),
    async onRename(id, title) {
      // Se guarda el contenido YA guardado con el título nuevo: los cambios sin
      // guardar del editor siguen pendientes, igual que antes de renombrar.
      const full = await _api(`/note?id=${encodeURIComponent(id)}`);
      const saved = await postNote({ id, title, delta: (full && full.delta) || { ops: [] } });
      sb.upsert({ id, title: saved.title || title, time: (saved.updated_at || Date.now() / 1000) * 1000 });
      if (id === activeId) noteTitleInput.value = saved.title || title;
      return id;
    },
    async onDuplicate(id) {
      const delta = await getDelta(id);
      const newId = Date.now().toString();
      const saved = await postNote({ id: newId, title: currentTitle(id), delta });
      const finalId = String(saved.id || newId);
      sb.upsert({ id: finalId, title: saved.title, time: (saved.updated_at || Date.now() / 1000) * 1000, snippet: _snippet(delta) });
      toast(t("duplicatedToast"));
      return finalId;
    },
    async onDelete(id) {
      await _api(`/note?id=${encodeURIComponent(id)}`, { method: "DELETE" });
      if (id === activeId) {
        setTimeout(async () => {
          const next = sb.newestId();
          activeId = null; _dirty = false; _notifyActiveChanged();
          if (next) await openNote(next, { skipDirtyCheck: true });
          else { noteTitleInput.value = ""; quill?.setText("", "api"); sb.setActive(null); }
        }, 0);
      }
    },
    menuItems: n => [
      { icon: "volume-2", label: t("readAloud"), onClick: () => noteReadAloud(n.id) },
      { icon: "map-pin", label: t("location"), onClick: () => openGeo(n.id) },
    ],
    exportItems: n => [
      { icon: "file-text", label: t("exportTxt"), onClick: () => exportNote(n.id, "txt") },
      { icon: "file-code", label: t("exportHtml"), onClick: () => exportNote(n.id, "html") },
    ],
  });

  function ensureQuill() {
    if (quill || !window.Quill) return;
    quill = new Quill("#quillEditor", { theme: "snow", modules: { toolbar: "#quillToolbar" } });
    quill.on("text-change", (_d, _o, source) => { if (source === "user") setDirty(true); });
    noteTitleInput.addEventListener("input", () => setDirty(true));
  }

  async function loadNotes() {
    try { sb.setItems(((await _api("/notes")) || []).map(toItem)); }
    catch (e) { console.warn("[NOTES] Error listando notas:", e); sb.setItems([]); }
  }

  async function noteReadAloud(id) {
    try {
      const text = _deltaToPlainText(await getDelta(id)).trim();
      if (!text) { toast(t("empty")); return; }
      window.parent.postMessage({ action: "speakText", text }, "*");
    } catch (e) { console.error("[NOTES] Error leyendo nota en voz alta:", e); }
  }

  function openGeo(id) {
    try { window.parent.postMessage({ action: "openGeoPicker", kind: "note", ref: id, title: currentTitle(id) }, "*"); } catch (_) {}
  }

  async function exportNote(id, kind) {
    const title = currentTitle(id);
    try {
      const delta = await getDelta(id);
      let blob;
      if (kind === "txt") {
        blob = new Blob([title + "\n\n" + _deltaToPlainText(delta)], { type: "text/plain;charset=utf-8" });
      } else {
        // Quill fuera de pantalla para pasar el delta a HTML con el mismo formato
        const hostEl = document.createElement("div");
        hostEl.style.cssText = "position:fixed;left:-10000px;top:0;width:800px;";
        document.body.append(hostEl);
        const tmp = new Quill(hostEl, { readOnly: true, modules: { toolbar: false } });
        tmp.setContents(delta);
        const body = tmp.root.innerHTML;
        hostEl.remove();
        const html = `<!DOCTYPE html>\n<html lang="${_LANG}"${_LANG === "ar" ? ' dir="rtl"' : ""}>\n<head>\n<meta charset="UTF-8">\n` +
          `<title>${escapeHTML(title)}</title>\n<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.55;color:#1f1f1f}</style>\n` +
          `</head>\n<body>\n<h1>${escapeHTML(title)}</h1>\n${body}\n</body>\n</html>\n`;
        blob = new Blob([html], { type: "text/html;charset=utf-8" });
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (title.replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "_").trim() || "note") + "." + kind;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      console.error("[NOTES] Error exportando nota:", e);
      toast("❌ " + e.message);
    }
  }

  function _notifyActiveChanged() {
    try { window.parent.postMessage({ type: "notesActiveChanged", id: activeId }, "*"); } catch (_) {}
  }

  async function openNote(id, { skipDirtyCheck = false } = {}) {
    if (!skipDirtyCheck && activeId !== id && !(await confirmDiscard())) return;
    _dirty = false;
    activeId = id;
    sb.setActive(id);
    _notifyActiveChanged();
    noteTitleInput.value = sb.getItem(id)?.title || "";
    ensureQuill();
    if (!quill) return;
    try {
      const full = await _api(`/note?id=${encodeURIComponent(id)}`);
      quill.setContents((full && full.delta) || { ops: [] }, "api");
    } catch (e) {
      console.warn("[NOTES] Error cargando nota:", e);
      quill.setText("", "api");
    }
    setDirty(false);
  }

  async function noteNew(folderId = null) {
    if (!(await confirmDiscard())) return;
    const id = Date.now().toString();
    try {
      const saved = await postNote({ id, title: t("untitled"), delta: { ops: [] } });
      const finalId = String(saved.id || id);
      sb.upsert({ id: finalId, title: saved.title || t("untitled"), time: (saved.updated_at || Date.now() / 1000) * 1000, snippet: "" });
      if (folderId) sb.placeIn(finalId, folderId);
      await openNote(finalId, { skipDirtyCheck: true });
      noteTitleInput.focus(); noteTitleInput.select();
    } catch (e) {
      console.error("[NOTES] Error creando nota:", e);
      toast("❌ " + e.message);
    }
  }

  async function noteSave() {
    const id = activeId;
    if (!id) return;
    const title = (noteTitleInput.value || "").trim() || t("untitled");
    const delta = quill ? quill.getContents() : { ops: [] };
    try {
      const saved = await postNote({ id, title, delta });
      setDirty(false);
      sb.upsert({ id, title: saved.title || title, time: (saved.updated_at || Date.now() / 1000) * 1000, snippet: _snippet(delta) });
      toast(t("savedToast"));
    } catch (e) {
      console.error("[NOTES] Error guardando nota:", e);
      toast("❌ " + t("saveError"));
    }
  }

  noteSaveBtn.addEventListener("click", noteSave);
  noteGeoBtn.addEventListener("click", () => { if (!activeId) { toast(t("geoNoNote")); return; } openGeo(activeId); });
  document.addEventListener("keydown", ev => {
    if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === "s") { ev.preventDefault(); noteSave(); }
  });
  window.addEventListener("beforeunload", e => { if (!_dirty) return; e.preventDefault(); e.returnValue = ""; });

  // El host puede pedir refrescar la nota activa tras un append externo
  // (p. ej. "enviar a notas" desde el chat o una wiki).
  window.addEventListener("message", e => {
    if (e.data?.type === "notesRefreshIfActive" && e.data.id && e.data.id === activeId) openNote(activeId, { skipDirtyCheck: true });
  });

  async function init() {
    OflSidebar.hydrateIcons();
    document.getElementById("noteSaveLbl").textContent = t("save");
    noteSaveBtn.title = t("save") + " (Ctrl+S)";
    noteGeoBtn.title = t("location"); noteGeoBtn.setAttribute("aria-label", t("location"));
    noteTitleInput.placeholder = t("untitled");
    ensureQuill();
    await Promise.all([loadNotes(), sb.ready]);

    // Deep-link: el host puede pedir abrir directamente una nota concreta
    // (p. ej. desde Mapas, Buscador global, Timeline o Calendario).
    const deep = new URLSearchParams(location.search).get("note");
    if (deep && sb.getItem(deep)) { sb.revealFolderOf(deep); await openNote(deep, { skipDirtyCheck: true }); }
    else if (sb.newestId()) await openNote(sb.newestId(), { skipDirtyCheck: true });
    else await noteNew();
  }
  init();
})();
</script>
</body>
</html>
