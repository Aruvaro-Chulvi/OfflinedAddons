<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Notes</title>
<style>
:root {
  --bg: #f6f6f6;
  --panel: #ffffff;
  --ink: #1f1f1f;
  --muted: #d6d6d6;
  --soft: #e9e9e9;
  --subtle: #6b7280;
  --accent: #2d2d2d;
}
[data-theme="dark"] {
  --bg: #0f0f10;
  --panel: #17181a;
  --ink: #e9e9ea;
  --muted: #2b2c31;
  --soft: #222327;
  --subtle: #9a9a9a;
  --accent: #dedede;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; overflow: hidden;
}
.hidden { display: none !important; }
button, input, select { font-family: inherit; }

.an-view { display: flex; width: 100%; height: 100%; background: var(--panel); }

/* ── Sidebar ── */
.an-sidebar {
  flex: 0 0 240px; display: flex; flex-direction: column;
  border-right: 1px solid var(--muted); background: var(--soft); min-width: 0;
}
.an-toolbar { display: flex; gap: 8px; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--muted); }
.an-toolbar button {
  font-size: .8rem; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--muted);
  background: var(--soft); color: var(--ink); cursor: pointer;
}
.an-toolbar button:hover { background: var(--muted); }
.an-search { padding: 8px; border-bottom: 1px solid var(--muted); }
.an-search input {
  width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--ink);
}
.an-list { flex: 1; overflow-y: auto; padding: 4px 0; list-style: none; margin: 0; }
.an-list-empty { padding: 16px 12px; color: var(--subtle); font-size: .82rem; text-align: center; }
.an-list li {
  padding: 8px 12px; cursor: pointer; font-size: .85rem; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-bottom: 1px solid rgba(0,0,0,0.03);
}
[data-theme="dark"] .an-list li { border-bottom-color: rgba(255,255,255,0.04); }
.an-list li.active { background: var(--muted); font-weight: 600; }
.an-list li:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }

/* ── Editor ── */
.an-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); overflow: hidden; }
.an-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--muted); flex-shrink: 0; }
.an-title-input {
  flex: 1; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--ink); font-size: .9rem; outline: none; transition: border-color .15s;
}
.an-title-input:focus { border-color: var(--accent); }

.an-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--soft);
  color: var(--ink); font-size: .82rem; cursor: pointer; display: inline-flex; align-items: center;
  gap: 5px; white-space: nowrap; transition: background .15s, border-color .15s;
}
.an-btn:hover { background: var(--muted); }
.an-btn:disabled { opacity: .45; cursor: not-allowed; }
.an-btn--export { background: transparent; border-color: var(--accent); color: var(--accent); flex-shrink: 0; }
.an-btn--export:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.an-btn--record { background: var(--accent); color: var(--bg); border-color: transparent; font-weight: 600; }
.an-btn--record:hover { filter: brightness(1.12); }
.an-btn--record.recording { background: #ef4444; color: #fff; animation: an-rec-pulse-btn .9s ease infinite alternate; }
@keyframes an-rec-pulse-btn { from { box-shadow: 0 0 0 0 rgba(239,68,68,.5); } to { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }

.an-viz-wrap { flex: 1 1 0; min-height: 120px; position: relative; overflow: hidden; background: #0d1117; border-bottom: 1px solid var(--muted); }
:root:not([data-theme="dark"]) .an-viz-wrap { background: #e8edf3; }
.an-visualizer { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }

.an-rec-indicator {
  position: absolute; top: 10px; left: 14px; display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,.45); backdrop-filter: blur(6px); border-radius: 999px;
  padding: 4px 12px 4px 8px; pointer-events: none; z-index: 5;
}
.an-rec-indicator.hidden { display: none; }
.an-rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; animation: an-dot-pulse .8s ease infinite alternate; flex-shrink: 0; }
@keyframes an-dot-pulse { from { opacity: 1; transform: scale(1); } to { opacity: .35; transform: scale(.7); } }
.an-rec-label { font-size: .72rem; font-weight: 700; color: #ef4444; letter-spacing: .08em; }
.an-rec-time { font-size: .78rem; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.8); }

.an-viz-idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; z-index: 4; }
.an-viz-idle.hidden { display: none; }
.an-viz-idle-icon { font-size: 2rem; opacity: .35; }
.an-viz-idle-text { font-size: .82rem; color: rgba(128,128,128,.7); text-align: center; }

.an-player { flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 10px 14px 8px; border-bottom: 1px solid var(--muted); background: var(--panel); }
.an-player.disabled { opacity: .45; pointer-events: none; }
.an-player-row { display: flex; align-items: center; gap: 8px; }
.an-transport { justify-content: center; gap: 12px; }
.an-tbtn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--muted); background: var(--soft);
  color: var(--ink); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .12s, transform .1s; flex-shrink: 0;
}
.an-tbtn:hover { background: var(--muted); transform: scale(1.08); }
.an-tbtn:active { transform: scale(.93); }
.an-tbtn--play { width: 52px; height: 52px; font-size: 20px; background: var(--panel); color: var(--ink); border: 2px solid var(--muted); }
.an-tbtn--play:hover { opacity: .85; filter: none; }
.an-tbtn--sm { width: 28px; height: 28px; font-size: 12px; border-radius: 8px; }

.an-seek-row { gap: 10px; }
.an-time { font-size: .75rem; font-variant-numeric: tabular-nums; color: var(--subtle); white-space: nowrap; min-width: 3ch; }
.an-time--dur { text-align: right; }
.an-seek-bar {
  flex: 1; height: 4px; cursor: pointer; accent-color: var(--accent);
  background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--seek-pct, 0%), var(--muted) var(--seek-pct, 0%), var(--muted) 100%);
  border-radius: 999px; outline: none; appearance: none; -webkit-appearance: none;
}
.an-seek-bar::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
.an-seek-bar::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); cursor: pointer; }

.an-player-bottom { gap: 10px; }
.an-vol-bar {
  width: 80px; height: 4px; cursor: pointer; accent-color: var(--ink);
  background: linear-gradient(to right, var(--ink) 0%, var(--ink) var(--vol-pct, 100%), var(--muted) var(--vol-pct, 100%), var(--muted) 100%);
  border-radius: 999px; outline: none; appearance: none; -webkit-appearance: none; opacity: .7;
}
.an-vol-bar::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); cursor: pointer; }
.an-vol-bar::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); cursor: pointer; }
.an-speed-sel { height: 26px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--muted); background: var(--soft); color: var(--ink); font-size: .78rem; cursor: pointer; outline: none; margin-left: auto; }

.an-rec-row { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--muted); background: var(--panel); }
.an-rec-clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: .85rem; font-weight: 600; color: var(--accent); letter-spacing: .04em; }

.an-filters-row { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 14px; font-size: .8rem; color: var(--subtle); border-bottom: 1px solid var(--muted); background: var(--panel); }
.an-filters-row label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }

/* ── Toast / confirm (mismo patrón que el resto de addons) ── */
#anToast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  background: var(--accent); color: var(--bg); padding: 8px 16px; border-radius: 10px;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 50;
}
#anToast.show { opacity: 1; transform: translate(-50%, 0); }
.an-confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
.an-confirm-card { background: var(--panel); border-radius: 12px; padding: 18px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.an-confirm-title { font-weight: 700; margin: 0 0 6px; }
.an-confirm-msg { margin: 0 0 16px; color: var(--subtle); font-size: .88rem; }
.an-confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ── Context menu (clic derecho sobre una nota de audio) ── */
.an-ctxmenu {
  position: fixed; z-index: 200; min-width: 220px; padding: 4px;
  background: var(--panel); border: 1px solid var(--muted); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); display: none;
}
.an-ctxmenu.show { display: block; }
.an-ctxmenu-item {
  padding: 7px 10px; border-radius: 6px; font-size: .85rem; cursor: pointer;
  display: flex; align-items: center; gap: 8px; color: var(--ink);
}
.an-ctxmenu-item:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="an-view">
  <aside class="an-sidebar">
    <div class="an-toolbar">
      <button id="audioNewBtn">➕ <span id="audioNewLbl">New</span></button>
      <button id="audioDelBtn">🗑️ <span id="audioDelLbl">Delete</span></button>
    </div>
    <div class="an-search">
      <input id="audioNotesSearch" type="search" placeholder="Search audio notes…">
    </div>
    <ul id="audioNotesList" class="an-list"></ul>
  </aside>
  <div id="anCtxMenu" class="an-ctxmenu"></div>

  <div class="an-editor">
    <div class="an-header">
      <input id="audioNoteTitle" class="an-title-input" type="text" placeholder="Untitled recording" autocomplete="off">
      <button id="audioExportBtn" class="an-btn an-btn--export" title="Download audio">⬇ <span id="audioExportLabel">Export</span></button>
    </div>

    <div class="an-viz-wrap">
      <canvas id="audioVisualizer" class="an-visualizer"></canvas>
      <div id="audioRecIndicator" class="an-rec-indicator hidden">
        <span class="an-rec-dot"></span>
        <span class="an-rec-label">REC</span>
        <span id="audioRecTimerViz" class="an-rec-time">00:00</span>
      </div>
      <div id="audioVizIdle" class="an-viz-idle">
        <span class="an-viz-idle-icon">🎙️</span>
        <span class="an-viz-idle-text" id="audioVizIdleText">Select a note or record a new one</span>
      </div>
    </div>

    <div class="an-player" id="audioCustomPlayer">
      <div class="an-player-row an-transport">
        <button id="audioPlayerRestart" class="an-tbtn" title="Restart">⏮</button>
        <button id="audioPlayerBack10"  class="an-tbtn" title="−10 s">⏪</button>
        <button id="audioPlayerPlay"    class="an-tbtn an-tbtn--play" title="Play / Pause">▶</button>
        <button id="audioPlayerFwd10"   class="an-tbtn" title="+10 s">⏩</button>
      </div>
      <div class="an-player-row an-seek-row">
        <span id="audioPlayerTimeElapsed" class="an-time">0:00</span>
        <input id="audioPlayerSeekBar" class="an-seek-bar" type="range" min="0" max="100" step="0.1" value="0">
        <span id="audioPlayerTimeDuration" class="an-time an-time--dur">0:00</span>
      </div>
      <div class="an-player-row an-player-bottom">
        <button id="audioPlayerMute" class="an-tbtn an-tbtn--sm" title="Mute / Unmute">🔊</button>
        <input id="audioPlayerVolume" class="an-vol-bar" type="range" min="0" max="1" step="0.02" value="1">
        <select id="audioPlayerSpeed" class="an-speed-sel" title="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </div>

    <div class="an-rec-row">
      <button id="audioRecBtn" class="an-btn an-btn--record">⏺ <span id="audioRecLabel">Record</span></button>
      <button id="audioStopBtn" class="an-btn" disabled>⏹ <span id="audioStopLabel">Stop</span></button>
      <span id="audioRecTimer" class="an-rec-clock">00:00</span>
    </div>

    <div class="an-filters-row">
      <label><input id="audioFilterNormalize" type="checkbox" checked> <span id="audioFilterNormalizeLabel">Normalize volume</span></label>
      <label><input id="audioFilterNoise" type="checkbox" checked> <span id="audioFilterNoiseLabel">Noise reduction</span></label>
      <label><input id="audioFilterHighpass" type="checkbox"> <span id="audioFilterHighpassLabel">High-pass filter</span></label>
    </div>

    <audio id="audioPlayer" preload="metadata" style="display:none;"></audio>
  </div>
</div>

<div id="anToast"></div>

      _state.mediaRecorder = recorder;
      _state.recordedChunks = [];
      recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) _state.recordedChunks.push(ev.data); };
      recorder.onstop = handleAudioRecordingStop;
      recorder.start();
      _startAudioTimer();
      updateAudioRecordingUi(true);
      _vizStartRec(stream);
    } catch (e) {
      console.error("[AUDIO] Error iniciando grabación:", e);
      toast(t("noSupport"));
      cleanupAudioStream();
    }
  }

  function stopAudioRecording() {
    if (!_state.mediaRecorder) return;
    try { _state.mediaRecorder.stop(); } catch (e) { console.warn("[AUDIO] Error al parar grabación:", e); }
  }

  async function handleAudioRecordingStop() {
    const chunks = _state.recordedChunks || [];
    const blob = new Blob(chunks, { type: (_state.mediaRecorder && _state.mediaRecorder.mimeType) || "audio/webm" });
    cleanupAudioStream();
    if (!blob.size) { console.warn("[AUDIO] Grabación vacía, no se guarda."); return; }

    const id = _state.activeId || Date.now().toString();
    let title = (audioTitleInput?.value || "").trim();
    if (!title) { toast(t("nameRequiredMsg")); audioTitleInput?.focus(); return; }

    const formData = new FormData();
    formData.append("id", id);
    formData.append("title", title);
    formData.append("file", blob, `${id}.webm`);

    try {
      const saved = await _api("/note", { method: "POST", body: formData });
      const finalId = saved.id || id;
      const finalTitle = saved.title || title;
      const existing = _state.items.find(n => n.id === finalId);
      if (existing) { existing.title = finalTitle; }
      else { _state.items.unshift({ id: finalId, title: finalTitle }); }
      _state.activeId = finalId;
      renderAudioNotesList();
      openAudioNote(finalId);
      toast(t("savedToast"));
    } catch (e) {
      console.error("[AUDIO] Error guardando nota de audio:", e);
      toast("❌ " + e.message);
    }
  }

  async function loadAudioNotes() {
    try { _state.items = await _api("/notes"); } catch (e) { console.warn("[AUDIO] Error listando notas:", e); _state.items = []; }
  }

  function renderAudioNotesList() {
    if (!audioNotesList) return;
    audioNotesList.innerHTML = "";
    const q = (_state.searchQuery || "").toLowerCase();
    const items = (_state.items || []).filter(n => !q || (n.title || "").toLowerCase().includes(q));
    if (!items.length) {
      audioNotesList.innerHTML = `<li class="an-list-empty">${escapeHTML(t("empty"))}</li>`;
      return;
    }
    items.forEach(n => {
      const li = document.createElement("li");
      li.dataset.id = n.id;
      li.textContent = n.title || t("untitled");
      if (n.id === _state.activeId) li.classList.add("active");
      li.addEventListener("click", () => openAudioNote(n.id));
      li.addEventListener("contextmenu", (ev) => { ev.preventDefault(); _showAudioCtxMenu(ev.clientX, ev.clientY, n); });
      audioNotesList.appendChild(li);
    });
  }

  // ── Context menu: renombrar / eliminar / exportar / adjuntar a calendario ──
  const _anCtxMenu = document.getElementById("anCtxMenu");
  function _hideAudioCtxMenu() { _anCtxMenu.classList.remove("show"); }
  function _showAudioCtxMenu(x, y, note) {
    _anCtxMenu.innerHTML = "";
    const mkItem = (icon, label, onClick) => {
      const it = document.createElement("div");
      it.className = "an-ctxmenu-item";
      it.textContent = `${icon} ${label}`;
      it.addEventListener("click", () => { _hideAudioCtxMenu(); onClick(); });
      return it;
    };
    _anCtxMenu.appendChild(mkItem("✏️", t("ctxRename"), () => _ctxRenameAudioNote(note)));
    _anCtxMenu.appendChild(mkItem("⬇️", t("ctxExportMp3"), () => _ctxExportAudioNote(note)));
    _anCtxMenu.appendChild(mkItem("📅", t("ctxAttachCalendar"), () => _ctxAttachAudioToCalendar(note)));
    _anCtxMenu.appendChild(mkItem("🗑️", t("del"), () => {
      _state.activeId = note.id;
      showAudioDeleteConfirm(note.title || t("untitled"));
    }));
    _anCtxMenu.classList.add("show");
    const maxX = window.innerWidth - 230, maxY = window.innerHeight - 160;
    _anCtxMenu.style.left = Math.min(x, Math.max(0, maxX)) + "px";
    _anCtxMenu.style.top  = Math.min(y, Math.max(0, maxY)) + "px";
  }
  document.addEventListener("click", _hideAudioCtxMenu);
  document.addEventListener("contextmenu", (e) => { if (!e.target.closest(".an-list li")) _hideAudioCtxMenu(); });

  async function _ctxRenameAudioNote(note) {
    const newTitle = window.prompt(t("renamePrompt"), note.title || "");
    if (!newTitle || !newTitle.trim() || newTitle.trim() === note.title) return;
    try {
      await fetch("/api/audio/rename", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: note.id, newTitle: newTitle.trim() }),
      });
      note.title = newTitle.trim();
      if (_state.activeId === note.id && audioTitleInput) audioTitleInput.value = note.title;
      renderAudioNotesList();
      toast(t("renamedToast"));
    } catch (e) {
      toast("❌ " + e.message);
    }
  }

  function _ctxExportAudioNote(note) {
    const url = `${API}/file?id=${encodeURIComponent(note.id)}`;
    const a = document.createElement("a");
    a.href = url; a.download = (note.title || "audio-note").replace(/[^a-z0-9_\-\.]/gi, "_") + ".mp3";
    a.click();
  }

  function _ctxAttachAudioToCalendar(note) {
    try {
      window.parent.postMessage({ action: "attachAudioToCalendar", audioId: note.id, title: note.title || t("untitled") }, "*");
    } catch (_) {}
    toast(t("attachedToast"));
  }

  function openAudioNote(id) {
    _state.activeId = id;
    const item = (_state.items || []).find(n => n.id === id);
    if (!item) return;
    if (audioTitleInput) audioTitleInput.value = item.title || t("untitled");

    const url = `${API}/file?id=${encodeURIComponent(id)}`;
    _vizStop();
    if (audioPlayer) { audioPlayer.pause(); audioPlayer.src = url; audioPlayer.load(); }
    _initAudioPlayerUI();

    const btnPlay = document.getElementById("audioPlayerPlay");
    if (btnPlay) btnPlay.textContent = "▶";
    const seekBar = document.getElementById("audioPlayerSeekBar");
    if (seekBar) { seekBar.value = 0; seekBar.style.setProperty("--seek-pct", "0%"); }
    const tElapsed = document.getElementById("audioPlayerTimeElapsed");
    if (tElapsed) tElapsed.textContent = "0:00";

    _vizShowIdle();
    const c = _vizGetCanvas();
    if (c) _vizDrawIdle(c);

    setAudioUiMode("readonly");
    renderAudioNotesList();
  }

  async function audioNoteDelete() {
    if (!_state.activeId) return;
    const id = _state.activeId;
    try { await _api(`/note?id=${encodeURIComponent(id)}`, { method: "DELETE" }); }
    catch (e) { console.error("[AUDIO] Error borrando nota de audio:", e); toast("❌ " + e.message); }
    _state.items = (_state.items || []).filter(n => n.id !== id);
    _state.activeId = null;
    if (audioTitleInput) audioTitleInput.value = "";
    if (audioPlayer) { audioPlayer.removeAttribute("src"); audioPlayer.load(); }
    setAudioUiMode("new");
    renderAudioNotesList();
  }

  function showAudioDeleteConfirm(name) {
    showConfirmDialog({
      title: t("deleteTitle"), message: name || t("deleteMsg"),
      confirmLabel: t("del"), cancelLabel: t("cancel"), onConfirm: audioNoteDelete
    });
  }

  // ── Bindings ──────────────────────────────────────────────────
  audioNewBtn?.addEventListener("click", () => {
    _state.activeId = null;
    if (audioTitleInput) audioTitleInput.value = "";
    if (audioPlayer) { audioPlayer.pause(); audioPlayer.removeAttribute("src"); audioPlayer.load(); }
    _vizStop();
    const btnPlay = document.getElementById("audioPlayerPlay");
    if (btnPlay) btnPlay.textContent = "▶";
    const seekBar = document.getElementById("audioPlayerSeekBar");
    if (seekBar) { seekBar.value = 0; seekBar.style.setProperty("--seek-pct", "0%"); }
    const tElapsed = document.getElementById("audioPlayerTimeElapsed");
    if (tElapsed) tElapsed.textContent = "0:00";
    const tDuration = document.getElementById("audioPlayerTimeDuration");
    if (tDuration) tDuration.textContent = "0:00";
    _vizShowIdle();
    const c = _vizGetCanvas();
    if (c) _vizDrawIdle(c);
    setAudioUiMode("new");
    renderAudioNotesList();
  });

  audioDelBtn?.addEventListener("click", () => {
    if (!_state.activeId) return;
    const active = _state.items.find(n => n.id === _state.activeId);
    showAudioDeleteConfirm(active?.title || t("untitled"));
  });

  audioRecBtn?.addEventListener("click", startAudioRecording);
  audioStopBtn?.addEventListener("click", stopAudioRecording);

  audioSearchInput?.addEventListener("input", (ev) => { _state.searchQuery = ev.target.value || ""; renderAudioNotesList(); });

  audioFilterNormalize?.addEventListener("change", (e) => { _state.filters.normalize = !!e.target.checked; });
  audioFilterNoise?.addEventListener("change", (e) => { _state.filters.noiseReduction = !!e.target.checked; });
  audioFilterHighpass?.addEventListener("change", (e) => { _state.filters.highpass = !!e.target.checked; });

  window.addEventListener("beforeunload", (e) => {
    if (!_state.isRecording) return;
    e.preventDefault(); e.returnValue = "";
  });

  async function init() {
    document.getElementById("audioNewLbl").textContent = t("newBtn");
    document.getElementById("audioDelLbl").textContent = t("del");
    audioSearchInput.placeholder = t("searchPh");
    document.getElementById("audioExportLabel").textContent = t("export");
    document.getElementById("audioRecLabel").textContent = t("record");
    document.getElementById("audioStopLabel").textContent = t("stop");
    document.getElementById("audioFilterNormalizeLabel").textContent = t("normalize");
    document.getElementById("audioFilterNoiseLabel").textContent = t("noise");
    document.getElementById("audioFilterHighpassLabel").textContent = t("highpass");
    document.getElementById("audioVizIdleText").textContent = t("idleText");
    audioTitleInput.placeholder = t("untitled");

    _initAudioPlayerUI();
    await loadAudioNotes();
    renderAudioNotesList();
    // Deep-link: el host puede pedir abrir directamente una nota concreta
    // (p. ej. desde una nota de audio vinculada en el Calendario).
    const deepLinkNote = new URLSearchParams(location.search).get("note");
    if (deepLinkNote && _state.items.some(n => n.id === deepLinkNote)) openAudioNote(deepLinkNote);
    else if (_state.activeId) openAudioNote(_state.activeId);
    else setAudioUiMode("new");
    _vizDrawIdle(_vizGetCanvas());
  }
  init();
})();
</script>
</body>
</html>
