<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whiteboard</title>
<script src="sidebar.js"></script>
<style>
:root {
  --bg: #f6f6f6;
  --panel: #ffffff;
  --ink: #1f1f1f;
  --muted: #d6d6d6;
  --soft: #e9e9e9;
  --subtle: #6b7280;
  --accent: #2d2d2d;
}
[data-theme="dark"] {
  --bg: #0f0f10;
  --panel: #17181a;
  --ink: #e9e9ea;
  --muted: #2b2c31;
  --soft: #222327;
  --subtle: #9a9a9a;
  --accent: #dedede;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; overflow: hidden;
}
.hidden { display: none !important; }
button, input { font-family: inherit; }

.wb-view { display: flex; width: 100%; height: 100%; background: var(--panel); }

/* ── Main area ── */
.wb-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.wb-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--muted); }
.wb-name-input {
  flex: 1; min-width: 0; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--ink); font-size: .9rem; outline: none; transition: border-color .15s;
}
.wb-name-input:focus { border-color: var(--accent); }
.wb-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--soft);
  color: var(--ink); font-size: .82rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center;
  gap: 6px; white-space: nowrap; transition: background .15s;
}
.wb-btn .ofs-ic { width: 16px; height: 16px; }
.wb-btn:hover { background: var(--muted); }

.wb-body { flex: 1; min-height: 0; position: relative; }
.wb-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }

#wbToast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  background: var(--accent); color: var(--bg); padding: 8px 16px; border-radius: 10px;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 500;
}
#wbToast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="wb-view">
  <div class="wb-main">
    <div class="wb-toolbar">
      <input id="wbNameInput" class="wb-name-input" type="text" placeholder="Drawing name…" autocomplete="off">
      <button class="wb-btn" id="wbSaveBtn"><svg data-ic="save"></svg><span id="wbSaveLbl">Save</span></button>
    </div>
    <div class="wb-body">
      <iframe id="wbFrame" class="wb-frame" src="about:blank" title="Whiteboard" loading="lazy"></iframe>
    </div>
  </div>
</div>

<div id="wbToast"></div>

<script>

  zh: { heading: "绘图", newItem: "新建绘图", searchPh: "搜索绘图…", empty: "还没有已保存的绘图。",
        untitled: "未命名绘图", deleteTitle: "删除绘图？", deleteMsg: "删除绘图“{name}”？此操作无法撤销。",
        save: "保存", namePh: "绘图名称…", savedToast: "白板已保存",
        confirmNewTitle: "未保存的更改", confirmNewMsg: "当前白板有未保存的更改，要放弃吗？",

        confirmSaveTitle: "चित्र अधिलेखित करें?", confirmOverwriteMsg: "इस नाम से पहले से एक चित्र मौजूद है। अधिलेखित करें?",

        duplicatedToast: "चित्र डुप्लिकेट हो गया", noImage: "इस चित्र की अभी कोई सहेजी गई छवि नहीं है।" },
  ar: { heading: "الرسومات", newItem: "رسم جديد", searchPh: "البحث في الرسومات…", empty: "لا توجد رسومات محفوظة بعد.",
        untitled: "رسم بلا عنوان", deleteTitle: "حذف الرسم؟", deleteMsg: "حذف الرسم «{name}»؟ لا يمكن التراجع عن هذا.",
        save: "حفظ", namePh: "اسم الرسم…", savedToast: "تم حفظ السبورة",
        confirmNewTitle: "تغييرات غير محفوظة", confirmNewMsg: "في السبورة الحالية تغييرات غير محفوظة. هل تريد تجاهلها؟",

        untitled: "Рисунок без названия", deleteTitle: "Удалить рисунок?", deleteMsg: "Удалить рисунок «{name}»? Это нельзя отменить.",
        save: "Сохранить", namePh: "Название рисунка…", savedToast: "Доска сохранена",

        confirmSaveTitle: "Перезаписать рисунок?", confirmOverwriteMsg: "Рисунок с таким именем уже существует. Перезаписать?",

        duplicatedToast: "Рисунок продублирован", noImage: "У этого рисунка ещё нет сохранённого изображения." },

(function () {
  const p = new URLSearchParams(location.search);
  const th = p.get("theme");
  if (th === "dark" || (!th && window.matchMedia?.("(prefers-color-scheme: dark)").matches))
    document.documentElement.setAttribute("data-theme", "dark");
})();
window.addEventListener("message", e => {
  if (e.data?.type === "theme") document.documentElement.setAttribute("data-theme", e.data.value);
});

const _LANG = (() => {
  const l = (new URLSearchParams(location.search).get("lang") || "en").slice(0, 2).toLowerCase();
  return I18N[l] ? l : "en";
})();
document.documentElement.setAttribute("lang", _LANG);
if (_LANG === "ar") document.documentElement.setAttribute("dir", "rtl");
function t(key) { return I18N[_LANG]?.[key] || I18N.en[key] || key; }

let _toastT = null;
function toast(msg) {
  const el = document.getElementById("wbToast");
  el.textContent = String(msg);
  el.classList.add("show");
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove("show"), 2400);
}

(function () {
  const API = "/api/addon-whiteboard";
  const BLANK_PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

  const wbSaveBtn   = document.getElementById("wbSaveBtn");
  const wbNameInput = document.getElementById("wbNameInput");
  const wbFrame     = document.getElementById("wbFrame");

  let _dirty = false;
  let _ignoreChanges = false;
  let _ignoreTimer = null;
  let _iframeReady = false;
  let _currentFile = null;     // "<name>.excalidraw.json"
  let _pendingFolder = null;   // carpeta donde irá un dibujo nuevo al guardarlo

  function setDirty(v) { _dirty = !!v; sb.setDirty(_dirty); }
  function _startIgnore(ms) {
    clearTimeout(_ignoreTimer);
    _ignoreChanges = true;
    setDirty(false);
    _ignoreTimer = setTimeout(() => { _ignoreChanges = false; }, ms);
  }
  function _endIgnore() { clearTimeout(_ignoreTimer); _ignoreChanges = false; setDirty(false); }

  async function _api(path, method = "GET", body = null) {
    const opts = { method };
    if (body !== null) { opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
    const r = await fetch(`${API}${path}`, opts);
    if (!r.ok) throw new Error(await r.text());
    const ct = r.headers.get("content-type") || "";
    return ct.includes("application/json") ? r.json() : null;
  }
  // Mismo criterio que el backend al guardar
  const sanitizeName = raw => (raw || "").replace(/[^A-Za-z0-9._-]/g, "_").replace(/^[._]+|[._]+$/g, "");
  const thumbUrl = (file, v) => `${API}/thumb?file=${encodeURIComponent(file)}${v ? "&v=" + v : ""}`;
  const toItem = it => ({ id: it.filename, title: it.name, time: (it.modified || 0) * 1000,
                          info: it.size ? `${Math.max(1, Math.round(it.size / 1024))} KB` : "" });
  const confirmDiscard = () => _dirty ? sb.dialog({ title: t("confirmNewTitle"), message: t("confirmNewMsg") }) : Promise.resolve(true);

  function download(url, filename) {
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.append(a); a.click(); a.remove();
  }

  // ── Barra lateral común ─────────────────────────────────────
  const sb = OflSidebar.create({
    host: document.querySelector(".wb-view"),
    before: document.querySelector(".wb-main"),
    addonId: "whiteboard", lang: _LANG, toast,
    strings: { heading: t("heading"), newItem: t("newItem"), searchPh: t("searchPh"), empty: t("empty"),
               untitled: t("untitled"), deleteTitle: t("deleteTitle"), deleteMsg: t("deleteMsg") },
    preview: n => thumbUrl(n.id, Math.round(n.time / 1000)),
    onOpen: id => openDrawing(id),
    onNew: fid => newDrawing(fid),
    async onRename(id, title) {
      // Mismo criterio que al guardar: si no, guardar después crearía otro archivo
      const safe = sanitizeName(title);
      if (!safe) throw new Error("rename");
      if (sb.items.some(x => x.title === safe && x.id !== id)) throw new Error(sb.t("nameTaken"));
      const r = await _api("/rename", "POST", { oldName: id, newName: safe });
      if (!r || !r.newFilename) throw new Error("rename");
      const n = sb.getItem(id);
      if (n) n.title = r.newName;
      if (_currentFile === id) { _currentFile = r.newFilename; wbNameInput.value = r.newName; }
      return r.newFilename;
    },
    async onDuplicate(id) {
      const n = sb.getItem(id); if (!n) return null;
      const scene = await _api(`/load?file=${encodeURIComponent(id)}`);
      let png = BLANK_PNG;
      try {
        const res = await fetch(thumbUrl(id, Date.now()));
        if (res.ok) {
          const blob = await res.blob();
          png = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
        }
      } catch (_) {}
      const taken = new Set(sb.items.map(x => x.title));
      let k = 2, name = `${n.title}-${k}`;
      while (taken.has(sanitizeName(name))) name = `${n.title}-${++k}`;
      const saved = await _api("/save", "POST", { name, pngDataUrl: png, excalidraw: typeof scene === "string" ? JSON.parse(scene) : scene });
      await loadList();
      toast(t("duplicatedToast"));
      return saved?.jsonFile || null;
    },
    async onDelete(id) {
      await _api(`/delete?file=${encodeURIComponent(id)}`, "DELETE");
      if (_currentFile === id) { _currentFile = null; wbNameInput.value = ""; resetCanvas(); }
    },
    exportItems: n => [
      { icon: "image", label: t("exportPng"), onClick: async () => {
          const r = await fetch(thumbUrl(n.id, Date.now())).catch(() => null);
          if (!r || !r.ok) { toast(t("noImage")); return; }
          const url = URL.createObjectURL(await r.blob());
          download(url, `${n.title}.png`);
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        } },
      { icon: "download", label: t("exportJson"), onClick: async () => {
          try {
            const scene = await _api(`/load?file=${encodeURIComponent(n.id)}`);
            const blob = new Blob([typeof scene === "string" ? scene : JSON.stringify(scene)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            download(url, `${n.title}.excalidraw`);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          } catch (e) { toast("❌ " + e.message); }
        } },
    ],
  });

  function ensureFrame() {
    if (wbFrame.dataset.loaded === "1") return;
    const theme = document.documentElement.getAttribute("data-theme") || "light";
    wbFrame.src = `/vendor/excalidraw/index.html?theme=${encodeURIComponent(theme)}`;
    wbFrame.dataset.loaded = "1";
    _startIgnore(8000);
  }

  async function loadList() {
    try { sb.setItems(((await _api("/list")) || []).map(toItem)); }
    catch { sb.setItems([]); }
    sb.setActive(_currentFile);
  }

  async function openDrawing(file) {
    if (file !== _currentFile && !(await confirmDiscard())) return;
    const n = sb.getItem(file); if (!n) return;
    _currentFile = file;
    _pendingFolder = null;
    wbNameInput.value = n.title;
    sb.setActive(file);
    ensureFrame();
    if (_iframeReady) await loadCurrentFile();
  }

  async function loadCurrentFile() {
    if (!_currentFile || !wbFrame.contentWindow) return;
    try {
      const res = await fetch(`${API}/load?file=${encodeURIComponent(_currentFile)}`);
      if (!res.ok) return;
      let scene = await res.json();
      if (typeof scene === "string") scene = JSON.parse(scene);
      _startIgnore(2500);
      wbFrame.contentWindow.postMessage({ type: "OFFLINED_WHITEBOARD_LOAD_SCENE", scene }, "*");
    } catch (err) { console.error("[whiteboard] load error", err); }
  }

  function resetCanvas() {
    ensureFrame();
    wbFrame.contentWindow?.postMessage({ type: "OFFLINED_WHITEBOARD_REQUEST_RESET" }, "*");
    _startIgnore(2000);
  }

  async function newDrawing(folderId = null) {
    if (!(await confirmDiscard())) return;
    resetCanvas();
    _currentFile = null;
    _pendingFolder = folderId || null;
    wbNameInput.value = "";
    sb.setActive(null);
    wbNameInput.focus();
  }

  async function save() {
    ensureFrame();
    if (!wbFrame.contentWindow) return;
    let finalName = (wbNameInput.value || "").trim();
    if (!finalName) {
      finalName = new Intl.DateTimeFormat(_LANG, { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(new Date());
      wbNameInput.value = finalName;
    }
    const safe = sanitizeName(finalName);
    const clash = sb.items.find(it => it.title === safe && it.id !== _currentFile);
    if (clash) {
      const ok = await sb.dialog({ title: t("confirmSaveTitle"), message: t("confirmOverwriteMsg"), confirmLabel: t("save") });
      if (!ok) return;
    }
    wbFrame.contentWindow.postMessage({ type: "OFFLINED_WHITEBOARD_REQUEST_EXPORT", name: finalName }, "*");
  }

  wbSaveBtn.addEventListener("click", save);
  document.addEventListener("keydown", ev => {
    if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === "s") { ev.preventDefault(); save(); }
  });

  window.addEventListener("message", async (event) => {
    const data = event.data || {};
    if (!data.type) return;
    if (data.type === "OFFLINED_WHITEBOARD_CHANGE") { if (!_ignoreChanges && !_dirty) setDirty(true); return; }
    if (data.type === "OFFLINED_WHITEBOARD_IFRAME_READY") {
      _iframeReady = true;
      setDirty(false);
      if (_currentFile) await loadCurrentFile();
      else _startIgnore(2000);
      return;
    }
    if (data.type !== "OFFLINED_WHITEBOARD_EXPORT_RESULT") return;

    const name = data.name || `drawing-${Date.now()}`;
    try {
      const prev = _currentFile;
      const json = await _api("/save", "POST", { name, pngDataUrl: data.pngDataUrl, excalidraw: data.excalidraw });
      if (json?.jsonFile) {
        // Guardar con otro nombre crea otro archivo (el anterior se queda): la copia
        // nueva va a la misma carpeta que el dibujo del que sale.
        if (prev && prev !== json.jsonFile && !sb.getItem(json.jsonFile) && sb.folderOf(prev)) _pendingFolder = sb.folderOf(prev);
        _currentFile = json.jsonFile;
      }
      _endIgnore();
      toast(t("savedToast"));
      await loadList();
      if (_pendingFolder && _currentFile) { sb.placeIn(_currentFile, _pendingFolder); _pendingFolder = null; }
    } catch (err) {
      console.error("[whiteboard] save error", err);
      toast("❌ " + err.message);
    }
  });

  window.addEventListener("beforeunload", (e) => { if (!_dirty) return; e.preventDefault(); e.returnValue = ""; });

  async function init() {
    OflSidebar.hydrateIcons();
    wbNameInput.placeholder = t("namePh");
    document.getElementById("wbSaveLbl").textContent = t("save");
    wbSaveBtn.title = t("save") + " (Ctrl+S)";
    await Promise.all([loadList(), sb.ready]);
    ensureFrame();
    const deep = new URLSearchParams(location.search).get("file");
    if (deep && sb.getItem(deep)) { sb.revealFolderOf(deep); openDrawing(deep); }
  }
  init();
})();
</script>
</body>
</html>
