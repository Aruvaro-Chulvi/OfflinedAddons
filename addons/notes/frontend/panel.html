<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="stylesheet" href="/vendor/quill/quill.snow.css">
<script src="/vendor/quill/quill.min.js"></script>
<style>
:root {
  --bg: #f6f6f6;
  --panel: #ffffff;
  --ink: #1f1f1f;
  --muted: #d6d6d6;
  --soft: #e9e9e9;
  --subtle: #6b7280;
  --accent: #2d2d2d;
}
[data-theme="dark"] {
  --bg: #0f0f10;
  --panel: #17181a;
  --ink: #e9e9ea;
  --muted: #2b2c31;
  --soft: #222327;
  --subtle: #9a9a9a;
  --accent: #dedede;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; overflow: hidden;
}
.hidden { display: none !important; }
button, input, select { font-family: inherit; }

.nt-view { display: flex; width: 100%; height: 100%; background: var(--panel); }

/* ── Sidebar ── */
.nt-sidebar {
  flex: 0 0 240px; display: flex; flex-direction: column;
  border-right: 1px solid var(--muted); background: var(--soft); min-width: 0;
}
.nt-toolbar { display: flex; gap: 8px; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--muted); }
.nt-toolbar button {
  font-size: .8rem; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--muted);
  background: var(--soft); color: var(--ink); cursor: pointer;
}
.nt-toolbar button:hover { background: var(--muted); }
.nt-search { padding: 8px; border-bottom: 1px solid var(--muted); }
.nt-search input {
  width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--ink);
}
.nt-list { flex: 1; overflow-y: auto; padding: 4px 0; list-style: none; margin: 0; }
.nt-list-empty { padding: 16px 12px; color: var(--subtle); font-size: .82rem; text-align: center; }
.nt-list li {
  padding: 8px 12px; cursor: pointer; font-size: .85rem; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-bottom: 1px solid rgba(0,0,0,0.03);
}
[data-theme="dark"] .nt-list li { border-bottom-color: rgba(255,255,255,0.04); }
.nt-list li.active { background: var(--muted); font-weight: 600; }
.nt-list li:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }

/* ── Editor ── */
.nt-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); overflow: hidden; }
.nt-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--muted); flex-shrink: 0; }
.nt-title-input {
  flex: 1; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--ink); font-size: .9rem; outline: none; transition: border-color .15s;
}
.nt-title-input:focus { border-color: var(--accent); }

.nt-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--soft);
  color: var(--ink); font-size: .82rem; cursor: pointer; display: inline-flex; align-items: center;
  gap: 5px; white-space: nowrap; transition: background .15s, border-color .15s;
}
.nt-btn:hover { background: var(--muted); }
.nt-btn:disabled { opacity: .45; cursor: not-allowed; }
.nt-btn--primary { background: var(--accent); color: var(--bg); border-color: transparent; font-weight: 600; }
.nt-btn--primary:hover { filter: brightness(1.12); }

/* ── Quill ── */
.nt-quill-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ql-toolbar.ql-snow {
  border: none !important; border-bottom: 1px solid var(--muted) !important;
  background: var(--panel); flex-shrink: 0;
}
.ql-container.ql-snow { border: none !important; flex: 1; overflow-y: auto; font-size: .95rem; }
.ql-editor { min-height: 100%; color: var(--ink); }
.ql-snow .ql-stroke { stroke: var(--ink); }
.ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill { fill: var(--ink); }
.ql-snow .ql-picker { color: var(--ink); }
.ql-snow .ql-picker-options { background: var(--panel); border-color: var(--muted) !important; }
.ql-editor.ql-blank::before { color: var(--subtle); }

/* ── Toast / confirm (mismo patrón que el resto de addons) ── */
#ntToast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  background: var(--accent); color: var(--bg); padding: 8px 16px; border-radius: 10px;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 50;
}
#ntToast.show { opacity: 1; transform: translate(-50%, 0); }
.nt-confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
.nt-confirm-card { background: var(--panel); border-radius: 12px; padding: 18px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.nt-confirm-title { font-weight: 700; margin: 0 0 6px; }
.nt-confirm-msg { margin: 0 0 16px; color: var(--subtle); font-size: .88rem; }
.nt-confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ── Context menu (clic derecho sobre una nota de la lista) ── */
.nt-ctxmenu {
  position: fixed; z-index: 200; min-width: 180px; padding: 4px;
  background: var(--panel); border: 1px solid var(--muted); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); display: none;
}
.nt-ctxmenu.show { display: block; }
.nt-ctxmenu-item {
  padding: 7px 10px; border-radius: 6px; font-size: .85rem; cursor: pointer;
  display: flex; align-items: center; gap: 8px; color: var(--ink);
}
.nt-ctxmenu-item:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="nt-view">
  <aside class="nt-sidebar">
    <div class="nt-toolbar">
      <button id="noteNewBtn">➕ <span id="noteNewLbl">New</span></button>
      <button id="noteDelBtn">🗑️ <span id="noteDelLbl">Delete</span></button>
    </div>
    <div class="nt-search">
      <input id="notesSearch" type="search" placeholder="Search notes…">
    </div>
    <ul id="notesList" class="nt-list"></ul>
  </aside>
  <div id="ntCtxMenu" class="nt-ctxmenu"></div>

  <div class="nt-editor">
    <div class="nt-header">
      <input id="noteTitle" class="nt-title-input" type="text" placeholder="Untitled note" autocomplete="off">
      <button id="noteGeoBtn" class="nt-btn" title="Location">📍</button>
      <button id="noteSaveBtn" class="nt-btn nt-btn--primary">💾 <span id="noteSaveLbl">Save</span></button>
    </div>
    <div class="nt-quill-wrap">
      <div id="quillToolbar">
        <span class="ql-formats">
          <select class="ql-header"></select>
          <button class="ql-bold"></button>
          <button class="ql-italic"></button>
          <button class="ql-underline"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="ordered"></button>
          <button class="ql-list" value="bullet"></button>
          <button class="ql-link"></button>
        </span>
      </div>
      <div id="quillEditor"></div>
    </div>
  </div>
</div>

<div id="ntToast"></div>

<script>

        untitled:"Nota sem título", deleteTitle:"Eliminar nota?", deleteMsg:'Tem a certeza que deseja eliminar a nota "{name}"?',
        cancel:"Cancelar", ok:"OK", empty:"Ainda sem notas guardadas.", savedToast:"Guardado",

        cancel:"Abbrechen", ok:"OK", empty:"Noch keine gespeicherten Notizen.", savedToast:"Gespeichert",

        geoNoNote:"Öffne oder speichere zuerst eine Notiz.", saveError:"Notiz konnte nicht gespeichert werden.",
        duplicateNote:"Notiz duplizieren", readAloud:"Notiz vorlesen", duplicatedToast:"Notiz dupliziert" },
  zh: { newBtn:"新建", del:"删除", save:"保存", searchPh:"搜索笔记…",
        untitled:"未命名笔记", deleteTitle:"删除笔记？", deleteMsg:'确定要删除笔记"{name}"吗？',
        cancel:"取消", ok:"确定", empty:"还没有已保存的笔记。", savedToast:"已保存",
        unsavedTitle:"未保存的更改", unsavedMsg:"你有未保存的更改，要放弃吗？",
        geoNoNote:"请先打开或保存一条笔记。", saveError:"无法保存笔记。",
        duplicateNote:"复制笔记", readAloud:"朗读笔记", duplicatedToast:"笔记已复制" },

        untitled:"शीर्षकहीन नोट", deleteTitle:"नोट हटाएं?", deleteMsg:'क्या आप वाकई "{name}" नोट हटाना चाहते हैं?',
        cancel:"रद्द करें", ok:"ठीक है", empty:"अभी तक कोई सहेजा गया नोट नहीं।", savedToast:"सहेजा गया",
        unsavedTitle:"असहेजे परिवर्तन", unsavedMsg:"आपके पास असहेजे परिवर्तन हैं। उन्हें छोड़ दें?",
        geoNoNote:"पहले एक नोट खोलें या सहेजें।", saveError:"नोट सहेजा नहीं जा सका।",
        duplicateNote:"नोट डुप्लिकेट करें", readAloud:"नोट पढ़ें", duplicatedToast:"नोट डुप्लिकेट हो गया" },
  ar: { newBtn:"جديد", del:"حذف", save:"حفظ", searchPh:"البحث في الملاحظات…",
        untitled:"ملاحظة بلا عنوان", deleteTitle:"حذف الملاحظة؟", deleteMsg:'هل تريد حقًا حذف الملاحظة "{name}"؟',
        cancel:"إلغاء", ok:"موافق", empty:"لا توجد ملاحظات محفوظة بعد.", savedToast:"تم الحفظ",
        unsavedTitle:"تغييرات غير محفوظة", unsavedMsg:"لديك تغييرات غير محفوظة. هل تريد تجاهلها؟",
        geoNoNote:"افتح أو احفظ ملاحظة أولاً.", saveError:"تعذر حفظ الملاحظة.",
        duplicateNote:"مضاعفة الملاحظة", readAloud:"قراءة الملاحظة بصوت عالٍ", duplicatedToast:"تمت مضاعفة الملاحظة" },
  ru: { newBtn:"Новая", del:"Удалить", save:"Сохранить", searchPh:"Поиск заметок…",
        untitled:"Заметка без названия", deleteTitle:"Удалить заметку?", deleteMsg:'Вы уверены, что хотите удалить заметку "{name}"?',
        cancel:"Отмена", ok:"ОК", empty:"Пока нет сохранённых заметок.", savedToast:"Сохранено",
        unsavedTitle:"Несохранённые изменения", unsavedMsg:"У вас есть несохранённые изменения. Отменить их?",
        geoNoNote:"Сначала откройте или сохраните заметку.", saveError:"Не удалось сохранить заметку.",
        duplicateNote:"Дублировать заметку", readAloud:"Прочитать заметку вслух", duplicatedToast:"Заметка продублирована" },
};

(function () {
  const p = new URLSearchParams(location.search);
  const th = p.get("theme");
  if (th === "dark" || (!th && window.matchMedia?.("(prefers-color-scheme: dark)").matches))
    document.documentElement.setAttribute("data-theme", "dark");
})();
window.addEventListener("message", e => { if (e.data?.type === "theme") document.documentElement.setAttribute("data-theme", e.data.value); });

const _LANG = (() => {
  const l = (new URLSearchParams(location.search).get("lang") || "en").slice(0, 2).toLowerCase();
  return I18N[l] ? l : "en";
})();
document.documentElement.setAttribute("lang", _LANG);
if (_LANG === "ar") document.documentElement.setAttribute("dir", "rtl");
function t(key) { return I18N[_LANG]?.[key] || I18N.en[key] || key; }
function tfmt(key, params) {
  let s = t(key);
  for (const k in (params || {})) s = s.replace(`{${k}}`, params[k]);
  return s;
}

function escapeHTML(s = "") { return String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch])); }

let _toastT = null;
function toast(msg) {
  const el = document.getElementById("ntToast");
  el.textContent = String(msg);
  el.classList.add("show");
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove("show"), 2400);
}

function showConfirmDialog({ title, message, confirmLabel, cancelLabel, onConfirm, onCancel }) {
  const ov = document.createElement("div");
  ov.className = "nt-confirm-overlay";
  const card = document.createElement("div");
  card.className = "nt-confirm-card";
  const h = document.createElement("p"); h.className = "nt-confirm-title"; h.textContent = title || "";
  const m = document.createElement("p"); m.className = "nt-confirm-msg"; m.textContent = message || "";
  const acts = document.createElement("div"); acts.className = "nt-confirm-actions";
  const cancel = document.createElement("button"); cancel.className = "nt-btn"; cancel.textContent = cancelLabel || t("cancel");
  const ok = document.createElement("button"); ok.className = "nt-btn nt-btn--primary"; ok.textContent = confirmLabel || t("ok");
  acts.append(cancel, ok); card.append(h, m, acts); ov.append(card); document.body.append(ov);
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") { close(); onCancel?.(); } };
  document.addEventListener("keydown", onKey);
  ov.addEventListener("click", e => { if (e.target === ov) { close(); onCancel?.(); } });
  cancel.addEventListener("click", () => { close(); onCancel?.(); });
  ok.addEventListener("click", () => { close(); onConfirm?.(); });
  ok.focus();
}
function showUnsavedConfirm() {
  return new Promise(resolve => {
    showConfirmDialog({
      title: t("unsavedTitle"), message: t("unsavedMsg"),
      confirmLabel: t("ok"), cancelLabel: t("cancel"),
      onConfirm: () => resolve(true), onCancel: () => resolve(false)
    });
  });
}

(function () {
  const API = "/api/addon-notes";

  // ── DOM refs ──
  const notesList     = document.getElementById("notesList");
  const noteNewBtn     = document.getElementById("noteNewBtn");
  const noteDelBtn     = document.getElementById("noteDelBtn");
  const noteSaveBtn    = document.getElementById("noteSaveBtn");
  const noteGeoBtn     = document.getElementById("noteGeoBtn");
  const noteTitleInput = document.getElementById("noteTitle");
  const notesSearchInput = document.getElementById("notesSearch");

  const _state = { items: [], activeId: null, searchQuery: "" };
  let quill = null;
  let _dirty = false;

  async function _api(path, opts) {
    const r = await fetch(`${API}${path}`, opts);
    if (!r.ok) throw new Error(await r.text());
    const ct = r.headers.get("content-type") || "";
    return ct.includes("application/json") ? r.json() : null;
  }

  function ensureQuill() {
    if (quill) return;
    if (!window.Quill) return;
    quill = new Quill("#quillEditor", { theme: "snow", modules: { toolbar: "#quillToolbar" } });
    quill.on("text-change", () => { _dirty = true; });
    noteTitleInput?.addEventListener("input", () => { _dirty = true; });
  }

  async function loadNotes() {
    try { _state.items = await _api("/notes"); } catch (e) { console.warn("[NOTES] Error listando notas:", e); _state.items = []; }
  }

  function renderNotesList() {
    if (!notesList) return;
    notesList.innerHTML = "";
    const q = (_state.searchQuery || "").toLowerCase();
    const items = (_state.items || []).filter(n => !q || (n.title || "").toLowerCase().includes(q));
    if (!items.length) {
      notesList.innerHTML = `<li class="nt-list-empty">${escapeHTML(t("empty"))}</li>`;
      return;
    }
    items.forEach(n => {
      const li = document.createElement("li");
      li.dataset.id = n.id;
      li.textContent = n.title || t("untitled");
      if (n.id === _state.activeId) li.classList.add("active");
      li.addEventListener("click", () => openNote(n.id));
      li.addEventListener("contextmenu", (ev) => { ev.preventDefault(); _showNoteCtxMenu(ev.clientX, ev.clientY, n.id); });
      notesList.appendChild(li);
    });
  }

  // ── Context menu: duplicar / leer en voz alta ─────────────────────────
  const ctxMenuEl = document.getElementById("ntCtxMenu");
  function _hideNoteCtxMenu() { ctxMenuEl.classList.remove("show"); }
  function _showNoteCtxMenu(x, y, id) {
    ctxMenuEl.innerHTML = "";
    const mkItem = (icon, label, onClick) => {
      const it = document.createElement("div");
      it.className = "nt-ctxmenu-item";
      it.textContent = `${icon} ${label}`;
      it.addEventListener("click", () => { _hideNoteCtxMenu(); onClick(); });
      return it;
    };
    ctxMenuEl.appendChild(mkItem("📑", t("duplicateNote"), () => noteDuplicate(id)));
    ctxMenuEl.appendChild(mkItem("🔊", t("readAloud"), () => noteReadAloud(id)));
    ctxMenuEl.classList.add("show");
    const maxX = window.innerWidth - 190, maxY = window.innerHeight - 90;
    ctxMenuEl.style.left = Math.min(x, Math.max(0, maxX)) + "px";
    ctxMenuEl.style.top  = Math.min(y, Math.max(0, maxY)) + "px";
  }
  document.addEventListener("click", _hideNoteCtxMenu);
  document.addEventListener("contextmenu", (e) => { if (!e.target.closest(".nt-list li")) _hideNoteCtxMenu(); });

  function _deltaToPlainText(delta) {
    return (delta?.ops || []).map(op => typeof op.insert === "string" ? op.insert : "").join("");
  }

  async function noteDuplicate(id) {
    const meta = _state.items.find(n => n.id === id);
    if (!meta) return;
    try {
      const full = await _api(`/note?id=${encodeURIComponent(id)}`);
      const newId = Date.now().toString();
      const title = meta.title || t("untitled");
      const delta = (full && full.delta) || { ops: [] };
      const saved = await _api("/note", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: newId, title, delta })
      });
      const finalId = saved.id || newId;
      _state.items.unshift({ id: finalId, title: saved.title || title });
      renderNotesList();
      toast(t("duplicatedToast"));
    } catch (e) {
      console.error("[NOTES] Error duplicando nota:", e);
      toast("❌ " + e.message);
    }
  }

  async function noteReadAloud(id) {
    try {
      const full = (id === _state.activeId && quill)
        ? { delta: quill.getContents() }
        : await _api(`/note?id=${encodeURIComponent(id)}`);
      const text = _deltaToPlainText(full && full.delta).trim();
      if (!text) { toast(t("empty")); return; }
      window.parent.postMessage({ action: "speakText", text }, "*");
    } catch (e) {
      console.error("[NOTES] Error leyendo nota en voz alta:", e);
    }
  }

  function _notifyActiveChanged() {
    try { window.parent.postMessage({ type: "notesActiveChanged", id: _state.activeId }, "*"); } catch (_) {}
  }

  async function openNote(id, { skipDirtyCheck = false } = {}) {
    if (!skipDirtyCheck && _dirty && _state.activeId && _state.activeId !== id) {
      const leave = await showUnsavedConfirm();
      if (!leave) return;
      _dirty = false;
    }
    _state.activeId = id;
    renderNotesList();
    _notifyActiveChanged();

    const meta = _state.items.find(n => n.id === id);
    if (noteTitleInput) noteTitleInput.value = meta?.title || "";

    ensureQuill();
    if (!quill) return;
    try {
      const full = await _api(`/note?id=${encodeURIComponent(id)}`);
      quill.setContents((full && full.delta) || { ops: [] });
    } catch (e) {
      console.warn("[NOTES] Error cargando nota:", e);
      quill.setText("");
    }
    _dirty = false;
  }

  async function noteNew() {
    if (_dirty && _state.activeId) {
      const leave = await showUnsavedConfirm();
      if (!leave) return;
      _dirty = false;
    }
    const id = Date.now().toString();
    const title = t("untitled");
    const delta = { ops: [] };
    try {
      const saved = await _api("/note", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, title, delta })
      });
      const finalId = saved.id || id;
      const finalTitle = saved.title || title;
      _state.items.unshift({ id: finalId, title: finalTitle });
      _state.activeId = finalId;
      renderNotesList();
      await openNote(finalId, { skipDirtyCheck: true });
    } catch (e) {
      console.error("[NOTES] Error creando nota:", e);
      toast("❌ " + e.message);
    }
  }

  async function noteDelete() {
    if (!_state.activeId) return;
    const id = _state.activeId;
    try { await _api(`/note?id=${encodeURIComponent(id)}`, { method: "DELETE" }); }
    catch (e) { console.error("[NOTES] Error borrando nota:", e); }

    const i = _state.items.findIndex(n => n.id === id);
    if (i >= 0) _state.items.splice(i, 1);
    _state.activeId = _state.items[0]?.id || null;
    _dirty = false;
    renderNotesList();
    _notifyActiveChanged();

    if (_state.activeId) {
      await openNote(_state.activeId, { skipDirtyCheck: true });
    } else {
      if (noteTitleInput) noteTitleInput.value = "";
      if (quill) quill.setText("");
    }
  }

  function showNoteDeleteConfirm(name) {
    showConfirmDialog({
      title: t("deleteTitle"), message: tfmt("deleteMsg", { name: name || t("untitled") }),
      confirmLabel: t("del"), cancelLabel: t("cancel"), onConfirm: noteDelete
    });
  }

  async function noteSave() {
    const id = _state.activeId;
    if (!id) return;
    const idx = _state.items.findIndex(n => n.id === id);
    if (idx < 0) return;

    const title = (noteTitleInput?.value || "").trim() || t("untitled");
    const delta = quill ? quill.getContents() : { ops: [] };

    try {
      const saved = await _api("/note", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, title, delta })
      });
      _state.items[idx].title = saved.title || title;
      _dirty = false;
      renderNotesList();
      toast(t("savedToast"));
    } catch (e) {
      console.error("[NOTES] Error guardando nota:", e);
      toast("❌ " + (t("saveError") || e.message));
    }
  }

  // ── Bindings ──────────────────────────────────────────────────
  noteNewBtn?.addEventListener("click", noteNew);
  noteDelBtn?.addEventListener("click", () => {
    if (!_state.activeId) return;
    const active = _state.items.find(n => n.id === _state.activeId);
    showNoteDeleteConfirm(active?.title || t("untitled"));
  });
  noteSaveBtn?.addEventListener("click", noteSave);
  noteGeoBtn?.addEventListener("click", () => {
    const id = _state.activeId;
    if (!id) { toast(t("geoNoNote")); return; }
    const title = (noteTitleInput?.value || "").trim() || t("untitled");
    try { window.parent.postMessage({ action: "openGeoPicker", kind: "note", ref: id, title }, "*"); } catch (_) {}
  });
  notesSearchInput?.addEventListener("input", (ev) => { _state.searchQuery = ev.target.value || ""; renderNotesList(); });

  window.addEventListener("beforeunload", (e) => {
    if (!_dirty) return;
    e.preventDefault(); e.returnValue = "";
  });

  // El host puede pedir refrescar la nota activa tras un append externo
  // (p. ej. "enviar a notas" desde el chat o una wiki).
  window.addEventListener("message", (e) => {
    if (e.data?.type === "notesRefreshIfActive" && e.data.id && e.data.id === _state.activeId) {
      openNote(_state.activeId, { skipDirtyCheck: true });
    }
  });

  async function init() {
    document.getElementById("noteNewLbl").textContent = t("newBtn");
    document.getElementById("noteDelLbl").textContent = t("del");
    document.getElementById("noteSaveLbl").textContent = t("save");
    if (notesSearchInput) notesSearchInput.placeholder = t("searchPh");
    if (noteTitleInput) noteTitleInput.placeholder = t("untitled");

    ensureQuill();
    await loadNotes();
    renderNotesList();

    // Deep-link: el host puede pedir abrir directamente una nota concreta
    // (p. ej. desde Mapas, Buscador global, Timeline o Calendario).
    const deepLinkNote = new URLSearchParams(location.search).get("note");
    if (deepLinkNote && _state.items.some(n => n.id === deepLinkNote)) {
      await openNote(deepLinkNote, { skipDirtyCheck: true });
    } else if (_state.items.length) {
      await openNote(_state.items[0].id, { skipDirtyCheck: true });
    } else {
      await noteNew();
    }
  }
  init();
})();
</script>
</body>
</html>
