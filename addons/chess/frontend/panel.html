<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess</title>
<link rel="stylesheet" href="chess.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Lucide icons (ISC licence) -->
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3l14 9-14 9z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></symbol>
    <symbol id="i-half" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M16 8h.01M8 8h.01M12 12h.01M8 16h.01M16 16h.01"/></symbol>
    <!-- Lucide chess pieces v1.77.0 (ISC); rook, knight and pawn outlines closed so they can be filled -->
    <symbol id="p-k" viewBox="0 0 24 24"><path d="m6.7 18-1-1C4.35 15.682 3 14.09 3 12a5 5 0 0 1 4.95-5c1.584 0 2.7.455 4.05 1.818C13.35 7.455 14.466 7 16.05 7A5 5 0 0 1 21 12c0 2.082-1.359 3.673-2.7 5l-1 1"/><path d="M4 20a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M10 4h4"/><path d="M12 2v6.818"/></symbol>
    <symbol id="p-q" viewBox="0 0 24 24"><path d="m10.68 5.499-.996 4.982a.65.65 0 01-1.131.295L5.885 7.663"/><path d="m13.32 5.5.995 4.98a.65.65 0 001.131.296l2.668-3.113"/><path d="M20.428 8.952 17.5 18"/><path d="M4 20a2 2 0 012-2h12a2 2 0 012 2v1a1 1 0 01-1 1H5a1 1 0 01-1-1z"/><path d="M6.5 18 3.571 8.952"/><circle cx="12" cy="4" r="2"/><circle cx="20" cy="7" r="2"/><circle cx="4" cy="7" r="2"/></symbol>
    <symbol id="p-r" viewBox="0 0 24 24"><path d="M6 2v5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2"/><path d="m7 18 1-9h8l1 9"/><path d="M5 20a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M10 2v2"/><path d="M14 2v2"/><path d="M6 4h12"/></symbol>
    <symbol id="p-b" viewBox="0 0 24 24"><path d="M15 18c1.5-.615 3-2.461 3-4.923C18 8.769 14.5 4.462 12 2 9.5 4.462 6 8.77 6 13.077 6 15.539 7.5 17.385 9 18"/><path d="M5 20a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="m16 7-2.5 2.5"/><path d="M9 2h6"/></symbol>
    <symbol id="p-n" viewBox="0 0 24 24"><path d="M16.5 18c1-2 2.5-5 2.5-9a7 7 0 0 0-7-7H6.635a1 1 0 0 0-.768 1.64L7 5l-2.32 5.802a2 2 0 0 0 .95 2.526l2.87 1.456L7 18"/><path d="M5 20a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="m15 5 1.425-1.425"/><path d="m17 8 1.53-1.53"/></symbol>
    <symbol id="p-p" viewBox="0 0 24 24"><path d="M8 18l1.5-8h5l1.5 8"/><path d="M5 20a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M7 10h10"/><circle cx="12" cy="6" r="4"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <!-- ═══════════ Side panel ═══════════ -->
  <aside class="side">
    <div class="user">
      <div class="avatar" id="avatar">?</div>
      <div><div class="name" id="userName">—</div><div class="sub" id="userSub"></div></div>
      <button class="close" id="drawerClose" data-tt="close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>

    <div class="sec">
      <button class="sec-h"><span data-t="newGame"></span><svg class="i chev"><use href="#i-chev"/></svg></button>
      <div class="sec-b">
        <div class="levels" id="levels"></div>
        <div class="lbl" data-t="playAs"></div>
        <div class="colors" id="colors">
          <button data-v="w"><svg class="pz w"><use href="#p-k"/></svg><span data-t="white"></span></button>
          <button data-v="b"><svg class="pz b"><use href="#p-k"/></svg><span data-t="black"></span></button>
          <button data-v="r"><svg class="i" style="width:24px;height:24px;stroke-width:1.6"><use href="#i-dice"/></svg><span data-t="random"></span></button>
        </div>
        <div class="lbl" data-t="clock"></div>
        <div class="seg full" id="clockSeg">
          <button data-v="0" data-t="noClock"></button><button data-v="5"></button><button data-v="10"></button><button data-v="15"></button>
        </div>
        <button class="btn cta wide" id="newBtn"><svg class="i"><use href="#i-play"/></svg><span data-t="start"></span></button>
      </div>
    </div>

    <div class="sec">
      <button class="sec-h"><span data-t="thisGame"></span><svg class="i chev"><use href="#i-chev"/></svg></button>
      <div class="sec-b">
        <div class="moves" id="moves"></div>
        <div class="row2"><button class="btn" id="pgnBtn"><svg class="i"><use href="#i-copy"/></svg><span data-t="copyPgn"></span></button></div>
      </div>
    </div>

    <div class="sec">
      <button class="sec-h"><span data-t="myStats"></span><svg class="i chev"><use href="#i-chev"/></svg></button>
      <div class="sec-b">
        <div class="stats-tabs" id="statTabs"></div>
        <div class="grid3">
          <div class="stat"><b id="stW">0</b><span data-t="won"></span></div>
          <div class="stat"><b id="stD">0</b><span data-t="draws"></span></div>
          <div class="stat"><b id="stL">0</b><span data-t="lost"></span></div>
        </div>
        <div class="help-line" id="stHelp"></div>
      </div>
    </div>

    <div class="sec closed">
      <button class="sec-h"><span data-t="settings"></span><svg class="i chev"><use href="#i-chev"/></svg></button>
      <div class="sec-b">
        <div class="opt"><span data-t="showLegal"></span><button class="sw" data-k="legal"></button></div>
        <div class="opt"><span data-t="showLast"></span><button class="sw" data-k="last"></button></div>
        <div class="opt"><span data-t="coords"></span><button class="sw" data-k="coords"></button></div>
        <div class="opt"><span data-t="theme"></span>
          <div class="seg" id="themeSeg"><button data-v="auto" data-t="auto"></button><button data-v="light" data-t="light"></button><button data-v="dark" data-t="dark"></button></div></div>
      </div>
    </div>
    <div class="store-note" id="storeNote" hidden data-t="offlineStore"></div>
  </aside>

  <!-- ═══════════ Game ═══════════ -->
  <main class="main" id="main">
    <div class="center">
      <div class="player" id="pTop">
        <button class="icon-btn" id="menuBtn" data-tt="menu"><svg class="i"><use href="#i-menu"/></svg></button>
        <div class="av" id="aiAv"></div>
        <div class="who"><div class="nm" data-t="computer"></div><div class="tag"><span id="aiLvl"></span> <span class="thinking" id="thinking" hidden>· <span data-t="thinking"></span></span></div></div>
        <div class="caps" id="capsTop"></div>
        <div class="clock" id="clockTop" hidden></div>
      </div>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board"></div>
        <svg class="arrow" id="arrow" viewBox="0 0 8 8"></svg>
        <div class="promo" id="promo"><div class="box"><div class="t" data-t="promo"></div><div class="pieces" id="promoPieces"></div></div></div>
      </div>
      <div class="player" id="pBot">
        <div class="av" id="meAv"></div>
        <div class="who"><div class="nm" data-t="you"></div><div class="tag" id="meColor"></div></div>
        <div class="caps" id="capsBot"></div>
        <div class="clock" id="clockBot" hidden></div>
      </div>
      <div class="tools">
        <button class="tool" id="undoBtn"><svg class="i"><use href="#i-undo"/></svg><span class="l" data-t="undo"></span></button>
        <button class="tool" id="hintBtn"><svg class="i"><use href="#i-bulb"/></svg><span class="l" data-t="hint"></span></button>
        <button class="tool" id="flipBtn"><svg class="i"><use href="#i-flip"/></svg><span class="l" data-t="flip"></span></button>
        <button class="tool" id="drawBtn"><svg class="i"><use href="#i-half"/></svg><span class="l" data-t="draw"></span></button>
        <button class="tool" id="resignBtn"><svg class="i"><use href="#i-flag"/></svg><span class="l" data-t="resign"></span></button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </main>
</div>

<div class="overlay" id="endDlg">
  <div class="dlg">
    <div class="badge" id="endBadge"><svg class="pz line"><use href="#p-k"/></svg></div>
    <h2 id="endTitle"></h2>
    <div class="sub" id="endSub"></div>
    <div class="grid3">
      <div class="stat"><b id="endW"></b><span data-t="won"></span></div>
      <div class="stat"><b id="endD"></b><span data-t="draws"></span></div>
      <div class="stat"><b id="endL"></b><span data-t="lost"></span></div>
    </div>
    <button class="btn cta wide" id="endAgain"><svg class="i"><use href="#i-play"/></svg><span data-t="another"></span></button>
    <div class="row2"><button class="btn" id="endPgn" data-t="copyPgn"></button><button class="btn" id="endClose" data-t="close"></button></div>
  </div>
</div>

<div class="overlay" id="confirmDlg">
  <div class="dlg">
    <p id="confirmText"></p>
    <div class="row2"><button class="btn" id="confirmNo" data-t="no"></button><button class="btn cta" id="confirmYes"></button></div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="engine/chess-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
