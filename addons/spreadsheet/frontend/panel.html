<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spreadsheet</title>
<script src="sidebar.js"></script>
<script src="sheet-import.js"></script>
<script src="sheet-export.js"></script>
<style>
:root {
  --bg: #f6f6f6;
  --panel: #ffffff;
  --ink: #1f1f1f;
  --muted: #d6d6d6;
  --soft: #e9e9e9;
  --subtle: #6b7280;
  --accent: #2d2d2d;
  --univer-btn-bg:      #e9e9e9;
  --univer-btn-text:    #1f1f1f;
  --univer-btn-border:  #c8c8c8;
  --univer-accent-bg:   #1f1f1f;
  --univer-accent-text: #ffffff;
  --univer-active-bg:   #2d2d2d;
  --univer-active-text: #ffffff;
  --univer-grey-area:   #c8c8c8;
}
[data-theme="dark"] {
  --bg: #0f0f10;
  --panel: #17181a;
  --ink: #e9e9ea;
  --muted: #2b2c31;
  --soft: #222327;
  --subtle: #9a9a9a;
  --accent: #dedede;
  --univer-btn-bg:      #2b2c31;
  --univer-btn-text:    #e9e9ea;
  --univer-btn-border:  #3a3b40;
  --univer-accent-bg:   #e9e9ea;
  --univer-accent-text: #0f0f10;
  --univer-active-bg:   #dedede;
  --univer-active-text: #0f0f10;
  --univer-grey-area:   #1a1a1a;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; overflow: hidden;
}
.hidden { display: none !important; }
button, input { font-family: inherit; }

.sp-shell { display: flex; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }

/* ── Editor area ── */
.sp-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
.sp-topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--panel); border-bottom: 1px solid var(--muted); flex-shrink: 0;
}
.sp-filename-input {
  flex: 1; min-width: 0; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--muted);
  background: var(--bg); color: var(--ink); font-size: .9rem; outline: none; transition: border-color .15s;
}
.sp-filename-input:focus { border-color: var(--accent); }
.sp-topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }
.sp-action-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--soft);
  color: var(--ink); font-size: .82rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center;
  gap: 6px; white-space: nowrap; transition: background .15s;
}
.sp-action-btn .ofs-ic { width: 16px; height: 16px; }
.sp-action-btn:hover { background: var(--muted); }
.sp-action-btn:disabled { opacity: .6; cursor: default; }
.sp-drop { position: fixed; inset: 0; z-index: 480; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 70%, transparent); pointer-events: none; }
.sp-drop-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 40px; border-radius: 14px; border: 2px dashed var(--subtle); background: var(--panel); color: var(--ink); font-weight: 600; }
.sp-drop-card .ofs-ic { width: 32px; height: 32px; color: var(--subtle); }
.sp-drop-card small { font-weight: 400; color: var(--subtle); }
@media (max-width: 640px) { #spImportLbl, #spExportLbl, #spSaveLbl { display: none; } }
.sp-action-btn.open { background: var(--muted); }
.sp-pop { position: fixed; z-index: 420; padding: 6px; border-radius: 10px; min-width: 210px; background: var(--panel); color: var(--ink); border: 1px solid var(--muted); box-shadow: 0 8px 28px rgba(0,0,0,.28); }
.sp-pop-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: none; background: transparent; color: inherit; border-radius: 7px; cursor: pointer; font-size: .84rem; text-align: start; }
.sp-pop-item .ofs-ic { width: 16px; height: 16px; }
.sp-pop-item:hover, .sp-pop-item:focus-visible { background: color-mix(in srgb, var(--ink) 7%, transparent); outline: none; }
.sp-pop-sep { height: 1px; margin: 5px 4px; background: var(--muted); }
.sp-pop-label { padding: 4px 10px 6px; font-size: .74rem; color: var(--subtle); max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-extras { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--soft); border-bottom: 1px solid var(--muted); font-size: .84rem; flex-shrink: 0; }
.sp-extras-msg { flex: 1; min-width: 0; }
.sp-extras-x { border: none; background: transparent; color: var(--subtle); font-size: 1.1rem; cursor: pointer; padding: 0 4px; }

.sp-container { flex: 1; min-height: 0; height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--univer-grey-area); }
.sp-container > .univer-app-layout { width: 100%; height: 100%; }
.sp-container input[type="text"], .sp-container textarea { pointer-events: auto !important; opacity: 1 !important; }
.sp-container canvas { display: block; outline: none; }

.sp-empty-msg {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--subtle); font-size: .95rem; gap: .5rem; pointer-events: none;
}
.sp-empty-msg .big-icon { font-size: 3rem; opacity: .35; }

/* ── Install panel ── */
.sp-install-panel {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .75rem; padding: 2rem; text-align: center; background: var(--bg);
}
.sp-install-icon { font-size: 3rem; line-height: 1; }
.sp-install-title { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--ink); }
.sp-install-desc { margin: 0; font-size: .88rem; color: var(--subtle); max-width: 380px; line-height: 1.55; }
.sp-install-btn {
  background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: .55rem 1.4rem;
  font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
}
.sp-install-btn:hover { opacity: .82; }
.sp-install-btn:disabled { opacity: .5; cursor: default; }
.sp-install-progress { display: flex; flex-direction: column; align-items: center; gap: .5rem; width: 100%; max-width: 340px; font-size: .82rem; color: var(--subtle); }
.sp-install-bar { width: 100%; height: 6px; background: var(--muted); border-radius: 99px; overflow: hidden; }
.sp-install-bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

/* ── Toast ── */
#spToast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  background: var(--accent); color: var(--bg); padding: 8px 16px; border-radius: 10px;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 50;
}
#spToast.show { opacity: 1; transform: translate(-50%, 0); }
/* Offlined: sin botones azules. Univer inyecta :root{--univer-primary-*} en azul (y no hace caso
   del tema por JS); se cambia esa escala por grises neutros: botones, pestaña activa, casillas. */
:root {
  --univer-primary-50: #F5F6F7 !important; --univer-primary-100: #ECEDEF !important;
  --univer-primary-200: #DCDEE2 !important; --univer-primary-300: #C3C7CE !important;
  --univer-primary-400: #9AA0AA !important; --univer-primary-500: #6B7280 !important;
  --univer-primary-600: #5B616C !important; --univer-primary-700: #4A4F58 !important;
  --univer-primary-800: #3A3E45 !important; --univer-primary-900: #2B2E33 !important;
}
</style>
</head>
<body>

<div class="sp-shell">
  <div class="sp-editor">
    <div class="sp-topbar">
      <input id="spFilenameInput" class="sp-filename-input" type="text" placeholder="Spreadsheet name…" spellcheck="false" autocomplete="off">
      <div class="sp-topbar-actions">
        <button class="sp-action-btn" id="spImportBtn"><svg data-ic="file-up"></svg><span id="spImportLbl">Import</span></button>
        <button class="sp-action-btn" id="spExportBtn"><svg data-ic="download"></svg><span id="spExportLbl">Export</span></button>
        <button class="sp-action-btn" id="spSaveBtn"><svg data-ic="save"></svg><span id="spSaveLbl">Save</span></button>
      </div>
    </div>
    <div id="spContainer" class="sp-container"></div>
  </div>
</div>

<div id="spToast"></div>
<div id="spDrop" class="sp-drop hidden"><div class="sp-drop-card"><svg data-ic="file-up"></svg><span id="spDropLbl"></span><small>.xlsx · .ods · .csv</small></div></div>
<input id="spImportInput" type="file" multiple class="hidden">

      const deep = (t, s) => { for (const k in s) { if (s[k] && typeof s[k] === "object" && !Array.isArray(s[k])) deep(t[k] = (t[k] && typeof t[k] === "object") ? t[k] : {}, s[k]); else t[k] = s[k]; } return t; };
      const r = {};
      for (let i = 0; i < arguments.length; i++) if (arguments[i] && typeof arguments[i] === "object") deep(r, arguments[i]);
      return r;
    };
    const camel = x => x.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("");
    const pkgs = [...UV_BASE_LOCALES, ...UV_PLUGIN_LOCALES];
    const pick = lang => pkgs.map(p => window["Univer" + camel(p) + camel(lang)]).filter(Boolean);
    const en = pick("en-US");
    const type = UV_LANG && C.LocaleType[UV_LANG.replace("-", "_").toUpperCase()];
    if (type) return { type, locales: { [type]: merge(...en, ...pick(UV_LANG)) } };
    return { type: C.LocaleType.EN_US, locales: { [C.LocaleType.EN_US]: merge(...en) } };
  }

  function _isDark() { return (document.documentElement.getAttribute("data-theme") || "light") === "dark"; }

  function _newUniverSheets(container) {
    const C = window.UniverCore;
    const D = window.UniverDesign;
    const F = window.UniverCoreFacade;

    const UniverRenderEnginePlugin    = window.UniverEngineRender    && window.UniverEngineRender.UniverRenderEnginePlugin;
    const UniverFormulaEnginePlugin   = window.UniverEngineFormula   && window.UniverEngineFormula.UniverFormulaEnginePlugin;
    const UniverUIPlugin              = window.UniverUi              && window.UniverUi.UniverUIPlugin;
    const UniverDocsPlugin            = window.UniverDocs            && window.UniverDocs.UniverDocsPlugin;
    const UniverDocsUIPlugin          = window.UniverDocsUi          && window.UniverDocsUi.UniverDocsUIPlugin;
    const UniverSheetsPlugin          = window.UniverSheets          && window.UniverSheets.UniverSheetsPlugin;
    const UniverSheetsUIPlugin        = window.UniverSheetsUi        && window.UniverSheetsUi.UniverSheetsUIPlugin;
    const UniverSheetsFormulaPlugin   = window.UniverSheetsFormula   && window.UniverSheetsFormula.UniverSheetsFormulaPlugin;
    const UniverSheetsFormulaUIPlugin = window.UniverSheetsFormulaUi && window.UniverSheetsFormulaUi.UniverSheetsFormulaUIPlugin;
    const UniverSheetsNumfmtPlugin    = window.UniverSheetsNumfmt    && window.UniverSheetsNumfmt.UniverSheetsNumfmtPlugin;
    const UniverSheetsNumfmtUIPlugin  = window.UniverSheetsNumfmtUi  && window.UniverSheetsNumfmtUi.UniverSheetsNumfmtUIPlugin;

    const loc = _buildLocales();
    const univer = new C.Univer({
      theme: D && D.defaultTheme,
      darkMode: _isDark(),
      locale: loc.type,
      locales: loc.locales,
    });

    if (UniverRenderEnginePlugin)    univer.registerPlugin(UniverRenderEnginePlugin);
    if (UniverFormulaEnginePlugin)   univer.registerPlugin(UniverFormulaEnginePlugin);
    if (UniverUIPlugin) univer.registerPlugin(UniverUIPlugin, { container, header: true, toolbar: true, footer: true, contextMenu: true });
    if (UniverDocsPlugin)            univer.registerPlugin(UniverDocsPlugin);
    if (UniverDocsUIPlugin)          univer.registerPlugin(UniverDocsUIPlugin);
    if (UniverSheetsPlugin)          univer.registerPlugin(UniverSheetsPlugin);
    if (UniverSheetsUIPlugin)        univer.registerPlugin(UniverSheetsUIPlugin);
    if (UniverSheetsFormulaPlugin)   univer.registerPlugin(UniverSheetsFormulaPlugin);
    if (UniverSheetsFormulaUIPlugin) univer.registerPlugin(UniverSheetsFormulaUIPlugin);
    if (UniverSheetsNumfmtPlugin)    univer.registerPlugin(UniverSheetsNumfmtPlugin);
    if (UniverSheetsNumfmtUIPlugin)  univer.registerPlugin(UniverSheetsNumfmtUIPlugin);

    // Plugins opcionales: el de interfaz solo si su base quedó registrada
    const done = new Set();
    const reg = (glob, cls, needs = []) => {
      const mod = window[glob];
      if (!mod || !mod[cls] || !needs.every(n => done.has(n))) return;
      try { univer.registerPlugin(mod[cls]); done.add(glob); }
      catch (e) { console.warn("[Sheets] plugin", cls, e); }
    };
    reg("UniverDataValidation", "UniverDataValidationPlugin");
    reg("UniverSheetsDataValidation", "UniverSheetsDataValidationPlugin", ["UniverDataValidation"]);
    reg("UniverSheetsDataValidationUi", "UniverSheetsDataValidationUIPlugin", ["UniverSheetsDataValidation"]);
    reg("UniverSheetsFilter", "UniverSheetsFilterPlugin");
    reg("UniverSheetsFilterUi", "UniverSheetsFilterUIPlugin", ["UniverSheetsFilter"]);
    reg("UniverSheetsSort", "UniverSheetsSortPlugin");
    reg("UniverSheetsSortUi", "UniverSheetsSortUIPlugin", ["UniverSheetsSort"]);
    reg("UniverSheetsConditionalFormatting", "UniverSheetsConditionalFormattingPlugin");
    reg("UniverSheetsConditionalFormattingUi", "UniverSheetsConditionalFormattingUIPlugin", ["UniverSheetsConditionalFormatting"]);
    reg("UniverFindReplace", "UniverFindReplacePlugin");
    reg("UniverSheetsFindReplace", "UniverSheetsFindReplacePlugin", ["UniverFindReplace"]);
    reg("UniverSheetsHyperLink", "UniverSheetsHyperLinkPlugin");
    reg("UniverSheetsHyperLinkUi", "UniverSheetsHyperLinkUIPlugin", ["UniverSheetsHyperLink", "UniverSheetsDataValidation"]);
    reg("UniverDrawing", "UniverDrawingPlugin");
    reg("UniverDrawingUi", "UniverDrawingUIPlugin", ["UniverDrawing"]);
    reg("UniverDocsDrawing", "UniverDocsDrawingPlugin", ["UniverDrawing"]);
    reg("UniverSheetsDrawing", "UniverSheetsDrawingPlugin", ["UniverDrawing"]);
    reg("UniverSheetsDrawingUi", "UniverSheetsDrawingUIPlugin", ["UniverSheetsDrawing", "UniverDrawingUi", "UniverDocsDrawing"]);
    reg("UniverSheetsNote", "UniverSheetsNotePlugin");
    reg("UniverSheetsNoteUi", "UniverSheetsNoteUIPlugin", ["UniverSheetsNote"]);
    reg("UniverSheetsTable", "UniverSheetsTablePlugin");
    reg("UniverSheetsTableUi", "UniverSheetsTableUIPlugin", ["UniverSheetsTable", "UniverSheetsSort"]);
    reg("UniverSheetsZenEditor", "UniverSheetsZenEditorPlugin");
    reg("UniverSheetsCrosshairHighlight", "UniverSheetsCrosshairHighlightPlugin");

    const univerAPI = (F && F.FUniver) ? F.FUniver.newAPI(univer) : null;
    return { univer, univerAPI };
  }

  // ══════════════════════════════════════════════════════════
  // Instalación (descarga de Univer bajo demanda)
  // ══════════════════════════════════════════════════════════
  let _univerStatus = null;
  async function _univerReady() {
    try {
      const r = await fetch("/api/univer/status");
      _univerStatus = await r.json();
      return _univerStatus.ready === true;
    } catch (_) { return false; }
  }
  // Univer bajado con un Offlined anterior: faltan los plugins/idiomas nuevos → aviso para bajarlos
  function _showExtrasBar() {
    if (!_univerStatus || _univerStatus.complete !== false || document.getElementById("spExtras")) return;
    const bar = document.createElement("div");
    bar.id = "spExtras"; bar.className = "sp-extras";
    bar.innerHTML = `<span class="sp-extras-msg"></span><button type="button" class="sp-action-btn"></button><button type="button" class="sp-extras-x" aria-label="×">×</button>`;
    bar.querySelector(".sp-extras-msg").textContent = t("extrasMsg");

    btn.textContent = t("extrasBtn");
    bar.querySelector(".sp-extras-x").addEventListener("click", () => bar.remove());
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = t("extrasBusy");
      try {
        const r = await fetch("/api/univer/download?missing=1", { method: "POST" });
        const d = await r.json();
        if (!r.ok || d.ok === false || (d.results || []).some(x => !x.ok)) throw new Error("download");
        if (_dirty) { bar.querySelector(".sp-extras-msg").textContent = t("extrasDoneSave"); btn.remove(); return; }
        btn.textContent = t("extrasDone");

      } catch (_) {

  function _showInstallPanel() {
    spContainer.innerHTML =
      '<div class="sp-install-panel">' +
      '  <span class="sp-install-icon">📦</span>' +
      '  <h3 class="sp-install-title">' + escapeHTML(t("installTitle")) + '</h3>' +
      '  <p class="sp-install-desc">' + escapeHTML(t("installDesc")) + '</p>' +
      '  <button class="sp-install-btn" id="spInstallBtn">' + escapeHTML(t("installBtn")) + '</button>' +
      '  <div class="sp-install-progress hidden" id="spInstallProgress">' +
      '    <div class="sp-install-bar"><div class="sp-install-bar-fill" id="spInstallFill"></div></div>' +
      '    <span id="spInstallMsg">' + escapeHTML(t("installStarting")) + '</span>' +
      '  </div>' +
      '</div>';
    document.getElementById("spInstallBtn").addEventListener("click", _doInstall);
  }

  async function _doInstall() {
    const btn = document.getElementById("spInstallBtn");
    const prog = document.getElementById("spInstallProgress");
    const fill = document.getElementById("spInstallFill");
    const msg = document.getElementById("spInstallMsg");

    if (btn) { btn.disabled = true; btn.textContent = t("installing"); }
    if (prog) prog.classList.remove("hidden");

    let pct = 0;
    const ticker = setInterval(() => {
      pct = Math.min(pct + 1.2, 88);
      if (fill) fill.style.width = pct + "%";
    }, 400);

    try {
      const res = await fetch("/api/univer/download", { method: "POST" });
      const data = await res.json();
      clearInterval(ticker);

      if (data.ok) {
        if (fill) fill.style.width = "100%";
        if (btn) btn.textContent = t("installed");
        await new Promise(r => setTimeout(r, 800));
        _univerLoaded = false; _univerLoadPromise = null;
        _sheetUniver = null;
        await sheetOpenNew();
      } else {
        const bad = (data.results || []).find(r => !r.ok);
        const errTxt = bad ? (bad.file + ": " + bad.error) : "Error";
        if (msg) msg.textContent = "❌ " + errTxt;
        if (btn) { btn.disabled = false; btn.textContent = t("retry"); }
      }
    } catch (e) {
      clearInterval(ticker);
      if (msg) msg.textContent = "❌ " + e.message;
      if (btn) { btn.disabled = false; btn.textContent = t("retry"); }
    }
  }

  // ══════════════════════════════════════════════════════════
  // Sheets: CRUD
  // ══════════════════════════════════════════════════════════
  function _sheetSnap(title) {
    return {
      id: "sheet-" + Date.now(),
      title: title || "Sheet1",
      sheetOrder: ["s1"],
      sheets: {
        s1: {
          id: "s1", name: "Sheet1", rowCount: 1000, columnCount: 26, zoomRatio: 1,
          scrollTop: 0, scrollLeft: 0, defaultColumnWidth: 93, defaultRowHeight: 27,
          cellData: {}, rowData: {}, columnData: {}, status: 1,
          freeze: { startRow: -1, startColumn: -1, ySplit: 0, xSplit: 0 }, mergeData: []
        }
      },
      styles: {}, namedRanges: [], locale: "en"
    };
  }

  async function _sheetEnsure() {
    if (_sheetUniver) return;
    const ready = await _univerReady();
    if (!ready) { _showInstallPanel(); throw new Error("not_ready"); }
    await _loadUniverScripts();
    spContainer.innerHTML = "";

    await new Promise(resolve => {
      requestAnimationFrame(() => requestAnimationFrame(() => { void spContainer.getBoundingClientRect(); resolve(); }));
    });

    const inst = _newUniverSheets(spContainer);
    _sheetUniver = inst.univer;
    _sheetAPI = inst.univerAPI;

    if (_sheetAPI && typeof _sheetAPI.onCommandExecuted === "function" && !_dirtyListenerAttached) {
      // Solo cuentan los cambios de datos (mutaciones), no mover la selección
      const MUT = (window.UniverCore && UniverCore.CommandType && UniverCore.CommandType.MUTATION != null) ? UniverCore.CommandType.MUTATION : 2;
      // Al abrir una hoja, varios plugins (filtros, validación, tablas…) hacen sus propias
      // mutaciones al prepararse: esos primeros instantes no cuentan como cambios.
      _sheetAPI.onCommandExecuted(cmd => {
        if (!cmd || Date.now() < _quietUntil) return;
        if ((cmd.type == null || cmd.type === MUT) && !_dirty) setDirty(true);
      });
      _dirtyListenerAttached = true;
    }
  }

  async function sheetOpenNew(folderId = null) {
    if (_dirty && !(await showUnsavedConfirm())) return;
    setDirty(false);
    try { await _sheetEnsure(); } catch (e) { if (e.message !== "not_ready") console.error(e); return; }
    try {
      if (_sheetUnit) { try { _sheetUniver.disposeUnit(_sheetUnit.getUnitId()); } catch (_) {} }
      _quietUntil = Date.now() + 1500;
      _sheetUnit = _sheetUniver.createUnit(UniverCore.UniverInstanceType.UNIVER_SHEET, _sheetSnap("Sheet1"));
      _sheetCurrentName = null;
      _pendingFolder = folderId || null;
      setDirty(false);
      if (spFilenameInput) { spFilenameInput.value = ""; spFilenameInput.focus(); }
      sb.setActive(null);
      window.dispatchEvent(new Event("resize"));
    } catch (e) { console.error(e); toast("❌ " + e.message); }
  }

  async function sheetOpenFile(name) {
    if (_dirty && _sheetCurrentName !== name && !(await showUnsavedConfirm())) return;
    try { await _sheetEnsure(); } catch (e) { if (e.message !== "not_ready") console.error(e); return; }
    try {
      const res = await fetch(`${API}/load?name=${encodeURIComponent(name)}`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();
      if (!d.data) throw new Error("El archivo no contiene datos válidos");

      if (_sheetUnit) { try { _sheetUniver.disposeUnit(_sheetUnit.getUnitId()); } catch (_) {} _sheetUnit = null; }

      const snapshot = Object.assign({}, d.data, { id: "sheet-" + Date.now() });
      _quietUntil = Date.now() + 1500;
      _sheetUnit = _sheetUniver.createUnit(UniverCore.UniverInstanceType.UNIVER_SHEET, snapshot);
      _sheetCurrentName = d.name;
      _pendingFolder = null;
      setDirty(false);
      if (spFilenameInput) spFilenameInput.value = d.name;
      sb.setActive(d.name);
      window.dispatchEvent(new Event("resize"));
    } catch (e) {
      console.error("[Sheets] openFile error:", e);
      toast("❌ " + e.message);
    }
  }

  // Hoja abierta con los datos de los plugins (filtros, formato condicional, validación,
  // notas, imágenes, enlaces, tablas): van en «resources», que getSnapshot() no incluye.
  function _snapshotNow() {
    try {
      const wb = _sheetAPI && _sheetAPI.getActiveWorkbook && _sheetAPI.getActiveWorkbook();
      if (wb && typeof wb.save === "function") { const snap = wb.save(); if (snap && snap.sheets) return snap; }
    } catch (e) { console.warn("[Sheets] save() de Univer falló, guardo solo las celdas:", e); }
    return _sheetUnit.getSnapshot();
  }

  async function sheetSave() {
    if (!_sheetUniver || !_sheetUnit) { toast("⚠️ " + t("createFirst")); return; }
    const name = (spFilenameInput?.value || "").trim() || t("untitled");
    const prev = _sheetCurrentName;
    try {
      const r = await fetch(`${API}/save`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, data: _snapshotNow() })
      });
      if (!r.ok) throw new Error(await r.text());
      const saved = await r.json().catch(() => ({}));
      const finalName = (saved.filename || name).replace(/\.usheet$/, "");
      // Guardar con otro nombre crea otra hoja (la anterior se queda): va a la misma carpeta.
      if (prev && prev !== finalName && !sb.getItem(finalName) && sb.folderOf(prev)) _pendingFolder = sb.folderOf(prev);
      _sheetCurrentName = finalName;
      setDirty(false);
      toast(t("savedToast") + " " + finalName);
      await refreshList();
      if (_pendingFolder) { sb.placeIn(finalName, _pendingFolder); _pendingFolder = null; }
    } catch (e) { toast("❌ " + e.message); }
  }

  function _showEmpty() {
    spContainer.innerHTML = `<div class="sp-empty-msg"><span class="big-icon">📊</span><span>${escapeHTML(t("emptyMsg"))}</span></div>`;
  }

  const toItem = it => ({ id: it.name, title: it.name, time: (it.modified || 0) * 1000,
                          info: it.size ? `${Math.max(1, Math.round(it.size / 1024))} KB` : "" });
  async function refreshList() {
    try { sb.setItems(((await (await fetch(`${API}/list`)).json()) || []).map(toItem)); }
    catch (e) { console.warn("[Sheets] list:", e); }
    sb.setActive(_sheetCurrentName);
  }

  async function getSnapshot(name) {
    if (name === _sheetCurrentName && _sheetUnit) return _snapshotNow();
    const d = await (await fetch(`${API}/load?name=${encodeURIComponent(name)}`)).json();
    return d.data;
  }

  // ── Barra lateral común ─────────────────────────────────────
  const sb = OflSidebar.create({
    host: document.querySelector(".sp-shell"),
    before: document.querySelector(".sp-editor"),
    addonId: "spreadsheet", lang: _LANG, toast, newIcon: "sheet",
    strings: { heading: t("heading"), newItem: t("newTitle"), searchPh: t("searchPh"), empty: t("empty"),
               untitled: t("untitled"), deleteTitle: t("deleteTitle"), deleteMsg: t("deleteMsg") },
    onLayout: () => window.dispatchEvent(new Event("resize")),
    onOpen: name => sheetOpenFile(name),
    onNew: fid => sheetOpenNew(fid),
    async onRename(name, title) {
      if (sb.getItem(title)) throw new Error(sb.t("nameTaken"));
      const r = await fetch(`${API}/rename`, { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ oldName: name, newName: title }) });
      if (!r.ok) throw new Error(r.status === 409 ? sb.t("nameTaken") : await r.text());
      const d = await r.json();
      const n = sb.getItem(name); if (n) n.title = d.name;
      if (_sheetCurrentName === name) { _sheetCurrentName = d.name; spFilenameInput.value = d.name; }
      return d.name;
    },
    async onDuplicate(name) {
      const data = await getSnapshot(name);
      const taken = new Set(sb.items.map(x => x.id));
      let k = 2, copy = `${name} (${k})`;
      while (taken.has(copy)) copy = `${name} (${++k})`;
      const r = await fetch(`${API}/save`, { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ name: copy, data }) });
      if (!r.ok) throw new Error(await r.text());
      await refreshList();
      toast(t("duplicatedToast"));
      return copy;
    },
    async onDelete(name) {
      const r = await fetch(`${API}/delete?name=${encodeURIComponent(name)}`, { method: "DELETE" });
      if (!r.ok && r.status !== 404) throw new Error(await r.text());
      if (_sheetCurrentName === name) {
        _sheetCurrentName = null;
        if (_sheetUnit) { try { _sheetUniver.disposeUnit(_sheetUnit.getUnitId()); } catch (_) {} _sheetUnit = null; }
        spFilenameInput.value = "";
        setDirty(false);
        _showEmpty();
      }
    },
    exportItems: n => [
      { icon: "download", label: t("expAs"), onClick: () => exportMenu(n.id) },
    ],
  });

  // ── Bindings ──────────────────────────────────────────────────
  spSaveBtn?.addEventListener("click", sheetSave);
  document.addEventListener("keydown", ev => {
    if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === "s") { ev.preventDefault(); sheetSave(); }
  }, true);

  window.addEventListener("beforeunload", (e) => {
    if (!_dirty) return;
    e.preventDefault(); e.returnValue = "";
  });

  // ── Exportar (.xlsx, .ods, .csv, .html, PDF) ─────────────────
  // El iframe del addon no puede descargar (sandbox sin allow-downloads): se guarda en
  // «Offlined Exports» a través de Offlined; fuera de Offlined, descarga normal.
  async function saveExport(blob, filename) {
    try {
      const fd = new FormData();
      fd.append("file", blob, filename);
      fd.append("filename", filename);
      const r = await fetch("/api/exports/save-file", { method: "POST", body: fd });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      toast(t("expSaved").replace("{name}", d.name || filename));
    } catch (e) {
      console.warn("[Sheets] Offlined no guardó el archivo, se descarga:", e);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  }
  function activeSheetId() {
    try { return _sheetAPI.getActiveWorkbook().getActiveSheet().getSheetId(); } catch (_) { return null; }
  }
  async function exportSheet(name, kind) {
    try {
      const isOpen = name === _sheetCurrentName && _sheetUnit;
      const snap = await getSnapshot(name);
      if (!snap) throw new Error("no data");
      const title = name || t("untitled");
      const base = title.replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "_").trim() || "hoja";
      if ((kind === "html" || kind === "pdf") && !(window.UniverCore && window.UniverCore.numfmt)) {
        try { if (await _univerReady()) await _loadUniverScripts(); } catch (_) {}      // para formatear los números
      }
      if (kind === "xlsx") await saveExport(await OflSheetExport.toXlsx(snap, title), base + ".xlsx");
      else if (kind === "ods") await saveExport(await OflSheetExport.toOds(snap, title, _LANG), base + ".ods");
      else if (kind === "csv") {
        const sid = (isOpen && activeSheetId()) || (snap.sheetOrder || [])[0];
        const sheetName = snap.sheets[sid] && snap.sheets[sid].name;
        const multi = (snap.sheetOrder || []).length > 1;
        await saveExport(new Blob([OflSheetExport.toCsv(snap, sid, _LANG)], { type: "text/csv;charset=utf-8" }), base + (multi && sheetName ? " - " + sheetName.replace(/[\\/:*?"<>|]+/g, "_") : "") + ".csv");
      }
      else if (kind === "html") await saveExport(new Blob([OflSheetExport.toHtml(snap, title, _LANG)], { type: "text/html;charset=utf-8" }), base + ".html");
      else if (kind === "pdf") await OflSheetExport.printPdf(snap, title, _LANG);
    } catch (e) {
      console.error("[Sheets] Error exportando:", e);
      toast("❌ " + t("expError"));
    }
  }
  let _expPop = null;
  function closeExportMenu() { if (_expPop) { _expPop.remove(); _expPop = null; document.getElementById("spExportBtn").classList.remove("open"); } }
  function exportMenu(name) {
    const again = !!_expPop;
    closeExportMenu();
    if (again && name === _sheetCurrentName) return;
    if (!name) { toast("⚠️ " + t("saveFirst")); return; }
    const anchor = document.getElementById("spExportBtn");
    const el = document.createElement("div");
    el.className = "sp-pop ofs-root"; el.setAttribute("role", "menu");
    if (name !== _sheetCurrentName) { const l = document.createElement("div"); l.className = "sp-pop-label"; l.textContent = name; el.append(l); }
    [["sheet", "expXlsx", "xlsx"], ["sheet", "expOds", "ods"], ["printer", "expPdf", "pdf"], "-", ["file-text", "expCsv", "csv"], ["file-code", "expHtml", "html"]].forEach(it => {
      if (it === "-") { const sp = document.createElement("div"); sp.className = "sp-pop-sep"; el.append(sp); return; }
      const [ic, key, kind] = it;
      const b = document.createElement("button");
      b.type = "button"; b.className = "sp-pop-item"; b.setAttribute("role", "menuitem");
      b.innerHTML = OflSidebar.ic(ic) + "<span></span>";
      b.querySelector("span").textContent = t(key);
      b.addEventListener("click", () => { closeExportMenu(); exportSheet(name, kind); });
      el.append(b);
    });
    document.body.append(el);
    _expPop = el;
    anchor.classList.add("open");
    const r = anchor.getBoundingClientRect();
    let x = document.documentElement.dir === "rtl" ? r.left : r.right - el.offsetWidth;
    x = Math.max(6, Math.min(x, innerWidth - el.offsetWidth - 6));
    el.style.left = x + "px"; el.style.top = (r.bottom + 4) + "px";
    el.querySelector(".sp-pop-item")?.focus();
  }
  document.addEventListener("mousedown", e => { if (_expPop && !_expPop.contains(e.target) && !document.getElementById("spExportBtn").contains(e.target)) closeExportMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeExportMenu(); });
  window.addEventListener("resize", closeExportMenu);
  document.getElementById("spExportBtn").addEventListener("click", () => {
    if (!_sheetCurrentName) { toast("⚠️ " + t("saveFirst")); return; }
    exportMenu(_sheetCurrentName);
  });

  // ── Importar (.xlsx, .ods, .csv) ──────────────────────────────
  const importInput = document.getElementById("spImportInput");
  importInput.accept = OflSheetImport.ACCEPT;
  document.getElementById("spImportBtn").addEventListener("click", () => { importInput.value = ""; importInput.click(); });
  importInput.addEventListener("change", () => importFiles([...importInput.files]));
  let _importing = false;
  const uniqueName = base => {
    const clean = (base || t("untitled")).replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "_").trim() || t("untitled");
    if (!sb.getItem(clean)) return clean;
    let k = 2; while (sb.getItem(`${clean} (${k})`)) k++;
    return `${clean} (${k})`;
  };
  async function importFiles(files) {
    if (!files.length || _importing) return;
    files.filter(f => !OflSheetImport.kindOf(f)).forEach(f => toast(t("impUnsupported").replace("{name}", f.name)));
    const docs = files.filter(f => OflSheetImport.kindOf(f));
    if (!docs.length) return;
    if (_dirty && !(await showUnsavedConfirm())) return;
    _importing = true;
    let last = null, ok = 0;
    const lost = new Set();
    try {
      for (const f of docs) {
        if (OflSheetImport.kindOf(f) === "legacy") { toast(t("impLegacy").replace("{name}", f.name)); continue; }
        toast(t("impBusy").replace("{name}", f.name));
        try {
          const { snapshot, title, warnings } = await OflSheetImport.toSnapshot(f);
          (warnings || []).forEach(w => lost.add(w));
          const name = uniqueName(title);
          snapshot.name = name;
          const r = await fetch(`${API}/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, data: snapshot }) });
          if (!r.ok) throw new Error(await r.text());
          const saved = await r.json().catch(() => ({}));
          last = (saved.filename || name).replace(/\.usheet$/, ""); ok++;
          await refreshList();
        } catch (e) {
          console.error("[Sheets] Error importando", f.name, e);
          toast(t("impError").replace("{name}", f.name));
        }
      }
    } finally { _importing = false; }
    if (last) {
      setDirty(false);
      await sheetOpenFile(last);
      let msg = ok > 1 ? t("impDoneN").replace("{n}", ok) : t("impDone").replace("{name}", last);
      if (lost.size) msg += " · " + t("impLost").replace("{what}", [...lost].map(w => t(w === "cf" ? "lostCf" : "lostImages")).join(", "));
      toast(msg);
    }
  }
  const dropEl = document.getElementById("spDrop");
  const isFileDrag = e => [...((e.dataTransfer && e.dataTransfer.items) || [])].some(i => i.kind === "file");
  let dragDepth = 0;
  window.addEventListener("dragenter", e => { if (isFileDrag(e)) { dragDepth++; dropEl.classList.remove("hidden"); } }, true);
  window.addEventListener("dragleave", () => { if (dropEl.classList.contains("hidden")) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropEl.classList.add("hidden"); }, true);
  window.addEventListener("dragover", e => { if (isFileDrag(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } }, true);
  window.addEventListener("drop", e => {
    const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
    dragDepth = 0; dropEl.classList.add("hidden");
    if (!files.length) return;
    // imágenes soltadas sobre la hoja: las recibe Univer (imágenes en celdas)
    if (files.every(f => /^image\//.test(f.type)) && e.target.closest && e.target.closest("#spContainer")) return;
    e.preventDefault(); e.stopPropagation();
    importFiles(files.filter(f => !/^image\//.test(f.type)));
  }, true);

  async function init() {
    OflSidebar.ICONS["printer"] = '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>';
    OflSidebar.ICONS["file-up"] = '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/>';
    OflSidebar.hydrateIcons();
    document.getElementById("spImportLbl").textContent = t("impBtn");
    document.getElementById("spExportLbl").textContent = t("expBtn");
    document.getElementById("spExportBtn").title = t("expTitle");
    document.getElementById("spImportBtn").title = t("impTitle");
    document.getElementById("spDropLbl").textContent = t("impDrop");
    document.getElementById("spSaveLbl").textContent = t("save");
    spSaveBtn.title = t("save") + " (Ctrl+S)";
    if (spFilenameInput) spFilenameInput.placeholder = t("filenamePh");

    await Promise.all([refreshList(), sb.ready]);
    if (!(await _univerReady())) { _showInstallPanel(); return; }
    _showExtrasBar();

    const deepLinkSheet = new URLSearchParams(location.search).get("sheet");
    if (deepLinkSheet) {
      sb.revealFolderOf(deepLinkSheet);
      await sheetOpenFile(deepLinkSheet);
    } else if (!_sheetUnit) {
      _showEmpty();
    }
  }
  init();
})();
</script>
</body>
</html>
